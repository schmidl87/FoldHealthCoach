                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/MainActivity.kt
          package de.fold8.healthcoach

          import android.content.Context
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.*
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.PermissionController
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch

          class MainActivity : ComponentActivity() {

              private lateinit var engine: HealthFusionEngine
              private var reportState by mutableStateOf<HealthReport?>(null)
              private var statusState by mutableStateOf("Prüfe Datenquellen...")
              private var rangeState by mutableStateOf(TimeRangeOption.DAYS_7)
              private var ageState by mutableIntStateOf(39)
              private var icuKeyState by mutableStateOf("")

              private val permLauncher = registerForActivityResult(
                  PermissionController.createRequestPermissionResultContract()
              ) { triggerSync() }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  engine = HealthFusionEngine(this)
                  val prefs = getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  ageState = prefs.getInt("user_age", 39)
                  icuKeyState = prefs.getString("intervals_api_key", "") ?: ""

                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(background = BgObsidian, surface = CardGlass, primary = NeonCyan)) {
                          FoldHealthApp(
                              report = reportState,
                              statusText = statusState,
                              selectedRange = rangeState,
                              savedAge = ageState,
                              savedIcuKey = icuKeyState,
                              onSelectRange = { rangeState = it; triggerSync() },
                              onRequestPermissions = {
                                  if (HealthConnectClient.getSdkStatus(this) == HealthConnectClient.SDK_AVAILABLE) {
                                      permLauncher.launch(HealthFusionEngine.REQUIRED_PERMISSIONS)
                                  }
                              },
                              onSyncWithSettings = { newAge, newIcuKey ->
                                  ageState = newAge
                                  icuKeyState = newIcuKey.trim()
                                  prefs.edit().putInt("user_age", ageState).putString("intervals_api_key", icuKeyState).apply()
                                  triggerSync()
                              },
                              onSaveMuscles = { workoutId, muscles ->
                                  prefs.edit().putStringSet("muscles_$workoutId", muscles.map { it.name }.toSet()).apply()
                                  triggerSync()
                              }
                          )
                      }
                  }
                  triggerSync()
              }

              private fun triggerSync() {
                  statusState = "Synchronisiere Garmin, Zwift, Fitbit, Withings & Speediance..."
                  lifecycleScope.launch {
                      try {
                          val rep = engine.buildReport(ageState, rangeState, icuKeyState)
                          reportState = rep
                          statusState = "Stand ${rep.generatedDateLabel} • Archiv: ${rep.archiveCount} Trainings"
                      } catch (e: Exception) {
                          statusState = "Hinweis: ${e.message}"
                      }
                  }
              }
          }
