                      addView(ageEdit); addView(keyEdit)
                      addView(Button(this@MainActivity).apply {
                          text = "Speichern & Neu berechnen"
                          setOnClickListener {
                              val a = ageEdit.text.toString().toIntOrNull()?.coerceIn(16, 99) ?: 39
                              prefs.edit().putInt("user_age", a).putString("gemini_api_key", keyEdit.text.toString()).apply()
                              refreshHealthData()
                          }
                      })
                      addView(Button(this@MainActivity).apply {
                          text = "Health Connect Rechte prüfen"
                          setOnClickListener { requestPermissionsLauncher.launch(HealthFusionEngine.REQUIRED_PERMISSIONS) }
                      })
                  })
              }

              private fun createCard(bg: String = "#12171F", stroke: String = "#1F2733") = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(30, 26, 30, 26)
                  background = pillBg(bg, stroke)
                  layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 20) }
              }

              private fun metricTile(title: String, value: String, accentHex: String) = createCard().apply {
                  addView(label(title, accentHex))
                  addView(bigMetric(value))
              }

              private fun label(txt: String, hex: String) = TextView(this).apply {
                  text = txt; textSize = 11f; setTypeface(null, Typeface.BOLD); setTextColor(Color.parseColor(hex)); setPadding(0, 0, 0, 6)
              }

              private fun bigMetric(txt: String) = TextView(this).apply {
                  text = txt; textSize = 19f; setTypeface(null, Typeface.BOLD); setTextColor(Color.WHITE); setPadding(0, 2, 0, 6)
              }

              private fun bodyText(txt: String) = TextView(this).apply {
                  text = txt; textSize = 13.5f; setTextColor(Color.parseColor("#C9D1D9")); setLineSpacing(6f, 1f)
              }

              private fun pillBg(bgHex: String, strokeHex: String) = GradientDrawable().apply {
                  setColor(Color.parseColor(bgHex)); cornerRadius = 26f; setStroke(2, Color.parseColor(strokeHex))
              }
          }
          EOF

      - name: Debug APK kompilieren
        run: gradle assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FoldHealthCoach-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
