                      fontSize = 10.sp,
                      fontWeight = FontWeight.SemiBold,
                      letterSpacing = 0.8.sp
                  )
              }
          }

          @Composable
          fun SmoothAreaChart(
              values: List<Float>,
              lineColor: Color,
              modifier: Modifier = Modifier.fillMaxWidth().height(90.dp)
          ) {
              val clean = values.filter { it > 0f }
              if (clean.size < 2) {
                  Box(modifier = modifier, contentAlignment = Alignment.CenterStart) {
                      Text("Verlauf sammelt sich mit den nächsten Messungen", color = Color(0xFF6E7681), fontSize = 12.sp)
                  }
                  return
              }
              Canvas(modifier = modifier) {
                  val minV = (clean.min() * 0.94f)
                  val maxV = (clean.max() * 1.04f)
                  val span = (maxV - minV).coerceAtLeast(1f)
                  val padV = 8.dp.toPx()
                  val h = size.height - padV * 2
                  val w = size.width

                  val pts = clean.mapIndexed { idx, v ->
                      val x = w * (idx.toFloat() / (clean.size - 1))
                      val y = padV + h * (1f - ((v - minV) / span).coerceIn(0f, 1f))
                      Offset(x, y)
                  }

                  val linePath = Path().apply {
                      moveTo(pts.first().x, pts.first().y)
                      for (i in 0 until pts.size - 1) {
                          val midX = (pts[i].x + pts[i + 1].x) / 2f
                          cubicTo(midX, pts[i].y, midX, pts[i + 1].y, pts[i + 1].x, pts[i + 1].y)
                      }
                  }

                  val fillPath = Path().apply {
                      addPath(linePath)
                      lineTo(pts.last().x, size.height)
                      lineTo(pts.first().x, size.height)
                      close()
                  }

                  drawPath(
                      path = fillPath,
                      brush = Brush.verticalGradient(
                          colors = listOf(lineColor.copy(alpha = 0.35f), Color.Transparent)
                      )
                  )
                  drawPath(
                      path = linePath,
                      color = lineColor,
                      style = Stroke(width = 2.6.dp.toPx(), cap = StrokeCap.Round)
                  )
              }
          }

          @Composable
          fun SleepHypnogramBar(sleep: SleepDetail, modifier: Modifier = Modifier.fillMaxWidth().height(22.dp)) {
              Canvas(modifier = modifier) {
                  val total = (sleep.deepMinutes + sleep.remMinutes + sleep.lightMinutes + sleep.awakeMinutes).coerceAtLeast(1L).toFloat()
                  val parts = listOf(
                      sleep.deepMinutes to Color(0xFF6E56CF),
                      sleep.remMinutes to Color(0xFFE5484D),
                      sleep.lightMinutes to Color(0xFF00B0FF),
                      sleep.awakeMinutes to Color(0xFFFFB020)
                  )
                  var curX = 0f
                  val gap = 3.dp.toPx()
                  for ((mins, col) in parts) {
                      if (mins <= 0L) continue
                      val segW = ((mins / total) * size.width - gap).coerceAtLeast(4.dp.toPx())
                      drawRoundRect(
                          color = col,
                          topLeft = Offset(curX, 0f),
                          size = Size(segW, size.height),
                          cornerRadius = CornerRadius(6.dp.toPx(), 6.dp.toPx())
                      )
                      curX += segW + gap
                  }
              }
          }
