          package de.fold8.healthcoach

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class GeminiCoachClient {

              suspend fun generateInsight(apiKey: String, report: HealthReport): String =
                  withContext(Dispatchers.IO) {
                      if (apiKey.isBlank()) return@withContext buildLocalCoachFallback(report)
                      val fp = report.fitnessProfile
                      val muscleText = report.periodMuscleSets.entries.joinToString(", ") { "${it.key.label}: ${it.value}×" }
                      val recentWorkouts = report.filteredWorkouts.takeLast(8).joinToString("; ") { w ->
                          val mg = if (w.muscleGroups.isEmpty()) "" else " [Muskeln: ${w.muscleGroups.joinToString { it.label }}]"
                          "${w.dateLabel} ${w.title}: ${w.durationMinutes} Min, ${w.activeKcal} kcal, Ø Puls ${w.avgHeartRate ?: "-"} bpm (${w.sourceSummary})$mg"
                      }.ifBlank { "Keine Trainings im gewählten Zeitraum." }

                      val prompt = "Du bist ein sportwissenschaftlicher KI-Gesundheitscoach (Speediance Krafttraining + Garmin + Zwift). " +
                          "Daten (${report.selectedRange.label}, Archiv: ${report.allHistoricalWorkoutsCount} Trainings): " +
                          "Alter: ${fp.chronologicalAge} J., Fitnessalter: ${fp.fitnessAge} J., Level: ${fp.fitnessLevelLabel} (${fp.fitnessScore}/100), " +
                          "Schritte: ${report.periodSteps}, Aktivkalorien: ${report.periodActiveKcal} kcal, " +
                          "Ruhepuls: ${report.latestRestingHr ?: "-"} bpm, Schlaf: ${report.latestSleepHours ?: "-"} Std., Erholung: ${report.recoveryScore}/100. " +
                          "Trainings: $recentWorkouts. Muskelgruppen: $muscleText. " +
                          "Antworte kurz auf Deutsch in 3 Abschnitten: 1. Fitnessalter & Belastung, 2. Muskelgruppen & Regeneration, 3. Empfehlung für das nächste Training."

                      try {
                          val endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}"
                          val conn = (URL(endpoint).openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Content-Type", "application/json; charset=UTF-8")
                              doOutput = true
                              connectTimeout = 15000
                              readTimeout = 20000
                          }
                          val payload = JSONObject().put("contents", JSONArray().put(JSONObject().put("parts", JSONArray().put(JSONObject().put("text", prompt)))))
                          conn.outputStream.use { it.write(payload.toString().toByteArray(Charsets.UTF_8)) }

                          val code = conn.responseCode
                          val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                          val responseText = stream.bufferedReader().use { it.readText() }
                          if (code !in 200..299) return@withContext buildLocalCoachFallback(report)

                          JSONObject(responseText).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim()
                      } catch (_: Exception) { buildLocalCoachFallback(report) }
                  }

              private fun buildLocalCoachFallback(report: HealthReport): String {
                  val fp = report.fitnessProfile
                  val undertrained = report.periodMuscleSets.filterValues { it == 0 }.keys.joinToString(", ") { it.label }
                  val muscleHint = if (undertrained.isBlank()) "Alle 6 Muskelgruppen wurden im Zeitraum abgedeckt." else "Im Zeitraum (${report.selectedRange.label}) noch offen: $undertrained."
                  return buildString {
                      appendLine("• Fitnessalter ${fp.fitnessAge} J. (${fp.fitnessLevelLabel}, ${fp.fitnessScore}/100) • Erholung ${report.recoveryScore}/100")
                      appendLine("• $muscleHint")
                      append(when {
                          report.recoveryScore >= 78 -> "• Empfehlung: Starke Erholung – ideal für Speediance-Kraft oder Zwift-Intervalle."
                          report.recoveryScore >= 68 -> "• Empfehlung: Gute Basis – moderates Training oder gezielt offene Muskelgruppen angehen."
                          else -> "• Empfehlung: Regeneration priorisieren (lockeres Zone-2-Fahren oder Mobilität)."
                      })
                  }
              }
          }
