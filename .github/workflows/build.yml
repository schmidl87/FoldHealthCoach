          @Composable
          fun FitnessPage(
              rep: HealthReport,
              isInner: Boolean,
              selectedRange: TimeRangeOption,
              onSelectRange: (TimeRangeOption) -> Unit,
              onOpenWorkout: (UnifiedWorkout) -> Unit
          ) {
              Row(modifier = Modifier.fillMaxWidth().padding(bottom = 12.dp), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                  TimeRangeOption.values().forEach { opt ->
                      val sel = opt == selectedRange
                      Surface(
                          shape = RoundedCornerShape(50),
                          color = if (sel) Color(0xFF1D293D) else CardGlass,
                          border = BorderStroke(1.dp, if (sel) NeonCyan else CardBorder),
                          modifier = Modifier.weight(1f).clickable { onSelectRange(opt) }
                      ) {
                          Box(contentAlignment = Alignment.Center, modifier = Modifier.padding(vertical = 8.dp)) {
                              Text(opt.label, color = if (sel) Color.White else MutedGray, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }

              val muscleCard: @Composable () -> Unit = {
                  BentoCard {
                      Text("SPEEDIANCE MUSKELGRUPPEN (${rep.selectedRange.label})", color = Color(0xFFFFB020), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(10.dp))
                      MuscleGroup.values().forEach { mg ->
                          val cnt = rep.periodMuscleSets[mg] ?: 0
                          Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(vertical = 4.dp)) {
                              Text(mg.label, color = Color.White, fontSize = 13.sp, modifier = Modifier.width(86.dp))
                              LinearProgressIndicator(
                                  progress = { (cnt / 4f).coerceIn(0f, 1f) },
                                  color = if (cnt > 0) NeonEmerald else CardBorder,
                                  trackColor = Color(0xFF1B2330),
                                  modifier = Modifier.weight(1f).height(8.dp).clip(RoundedCornerShape(4.dp))
                              )
                              Spacer(Modifier.width(10.dp))
                              Text("${cnt}×", color = if (cnt > 0) NeonEmerald else MutedGray, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
              }

              val workoutList: @Composable () -> Unit = {
                  Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                      if (rep.filteredWorkouts.isEmpty()) {
                          BentoCard { Text("Keine Trainings im Zeitraum (${rep.selectedRange.label}).", color = MutedGray, fontSize = 13.sp) }
                      }
                      rep.filteredWorkouts.reversed().forEach { w ->
                          val badgeCol = if (w.sourceSummary.contains("Zwift", true)) ZwiftOrange else if (w.isStrength) Color(0xFFFFB020) else NeonCyan
                          BentoCard(modifier = Modifier.clickable { onOpenWorkout(w) }) {
                              Text("${w.dateLabel} • ${w.sourceSummary.uppercase()} • STRAIN ${w.strainScore}", color = badgeCol, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(4.dp))
                              Text("${w.title} (${w.durationMinutes} Min.)", color = Color.White, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(4.dp))
                              val wattInfo = w.avgWatts?.let { "  |  ⚡ Ø ${it}W" } ?: ""
                              val distInfo = w.distanceKm?.let { "  |  ${it} km" } ?: ""
                              Text("♥ Ø ${w.avgHeartRate ?: "-"} / Max ${w.maxHeartRate ?: "-"} bpm  |  🔥 ${w.activeKcal} kcal$wattInfo$distInfo", color = Color(0xFFC9D1D9), fontSize = 12.sp)
                              if (w.hrCurve.size >= 2) {
                                  Spacer(Modifier.height(6.dp))
                                  SmoothAreaChart(w.hrCurve.map { it.toFloat() }, HealthCoral, Modifier.fillMaxWidth().height(54.dp))
                              }
                          }
                      }
                  }
              }

              if (isInner) {
                  Row(horizontalArrangement = Arrangement.spacedBy(22.dp)) {
                      Column(Modifier.weight(0.9f)) { muscleCard() }
                      Column(Modifier.weight(1.1f)) { workoutList() }
                  }
              } else {
                  muscleCard(); Spacer(Modifier.height(14.dp)); workoutList()
              }
          }
