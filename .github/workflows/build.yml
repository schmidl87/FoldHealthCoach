              private suspend fun readWithingsBodyComp(
                  client: HealthConnectClient,
                  start: Instant,
                  end: Instant,
                  icuWellness: List<IntervalsWellnessDay>,
                  zone: ZoneId
              ): BodyComposition {
                  val weights = readAll<WeightRecord>(client, start, end).sortedBy { it.time }
                  val fats = readAll<BodyFatRecord>(client, start, end).sortedBy { it.time }
                  val leans = readAll<LeanBodyMassRecord>(client, start, end).sortedBy { it.time }
                  val bones = readAll<BoneMassRecord>(client, start, end).sortedBy { it.time }
                  val waters = readAll<BodyWaterMassRecord>(client, start, end).sortedBy { it.time }

                  val latestW = weights.lastOrNull()
                  val weightKg = latestW?.weight?.inKilograms?.let { (it * 10.0).roundToInt() / 10.0 }
                      ?: icuWellness.lastOrNull { it.weightKg != null }?.weightKg
                  val fatPct = fats.lastOrNull()?.percentage?.value?.let { (it * 10.0).roundToInt() / 10.0 }
                  val muscleKg = leans.lastOrNull()?.mass?.inKilograms?.let { (it * 10.0).roundToInt() / 10.0 }
                  val boneKg = bones.lastOrNull()?.mass?.inKilograms?.let { (it * 10.0).roundToInt() / 10.0 }
                  val waterKg = waters.lastOrNull()?.mass?.inKilograms?.let { (it * 10.0).roundToInt() / 10.0 }
                  val dateLbl = latestW?.time?.let { DateTimeFormatter.ofPattern("dd.MM.").withZone(zone).format(it) }

                  val trend = weights.takeLast(7).map {
                      DateTimeFormatter.ofPattern("dd.MM").withZone(zone).format(it.time) to it.weight.inKilograms.toFloat()
                  }
                  return BodyComposition(weightKg, fatPct, muscleKg, boneKg, waterKg, dateLbl, trend)
              }

              private fun fuseAllWorkouts(
                  icuWorkouts: List<UnifiedWorkout>,
                  hcSessions: List<ExerciseSessionRecord>,
                  hcHr: List<HeartRateRecord>,
                  hcCal: List<ActiveCaloriesBurnedRecord>,
                  prefs: android.content.SharedPreferences,
                  logs: MutableList<String>,
                  filterStart: Instant,
                  age: Int
              ): List<UnifiedWorkout> {
                  val zone = ZoneId.systemDefault()
                  val dateFmt = DateTimeFormatter.ofPattern("dd.MM.").withZone(zone)
                  val estMaxHr = (211 - 0.64 * age).roundToInt().coerceIn(160, 205)

                  val hcConverted = hcSessions.map { s ->
                      val src = classifyPkg(s.metadata.dataOrigin.packageName)
                      val durMin = Duration.between(s.startTime, s.endTime).toMinutes().coerceAtLeast(1L)
                      val isStr = src == DataSource.SPEEDIANCE || s.exerciseType in setOf(
                          ExerciseSessionRecord.EXERCISE_TYPE_STRENGTH_TRAINING,
                          ExerciseSessionRecord.EXERCISE_TYPE_WEIGHTLIFTING,
                          ExerciseSessionRecord.EXERCISE_TYPE_CALISTHENICS
                      )
                      val samples = hcHr.filter { it.endTime >= s.startTime && it.startTime <= s.endTime }
                          .flatMap { it.samples }.filter { it.time in s.startTime..s.endTime }
                          .sortedBy { it.time }.map { it.beatsPerMinute.toInt() }
                      val avgHr = if (samples.isNotEmpty()) samples.average().roundToInt() else null
                      val maxHr = samples.maxOrNull()
                      val curve = downsample(samples, 36)
                      val zones = computeZones(samples, durMin.toInt(), estMaxHr)
                      val kcal = hcCal.filter { overlap(s.startTime, s.endTime, it.startTime, it.endTime) >= 0.50 }
                          .map { it.energy.inKilocalories.roundToInt() }.firstOrNull { it in 10..2500 } ?: (durMin * 6).toInt()
                      val id = "hc_${s.startTime.epochSecond}_${durMin}"
                      val title = s.title?.takeIf { it.isNotBlank() } ?: if (isStr) "Krafttraining (${src.label})" else "Training (${src.label})"
                      val muscles = FitnessAgeEngine.detectMuscles(s, null, prefs.getStringSet("muscles_$id", emptySet()) ?: emptySet())
                      val strain = ((ln(1.0 + durMin * ((avgHr ?: 115).toDouble() / estMaxHr) * 0.45) * 3.8).coerceIn(1.5, 20.5) * 10.0).roundToInt() / 10.0
                      val isNonStep = isStr || s.exerciseType in setOf(ExerciseSessionRecord.EXERCISE_TYPE_BIKING, ExerciseSessionRecord.EXERCISE_TYPE_BIKING_STATIONARY)
                      UnifiedWorkout(id, dateFmt.format(s.startTime), title, s.startTime, s.endTime, durMin, avgHr, maxHr, null, null, null, curve, zones, kcal, strain, src.label, isStr, isNonStep, muscles)
                  }

                  val combined = (icuWorkouts + hcConverted).sortedBy { it.startTime }
                  val used = BooleanArray(combined.size)
                  val merged = mutableListOf<UnifiedWorkout>()

                  for (i in combined.indices) {
                      if (used[i]) continue
                      var cur = combined[i]
                      for (j in i + 1 until combined.size) {
                          if (used[j]) continue
                          val other = combined[j]
                          if (overlap(cur.startTime, cur.endTime, other.startTime, other.endTime) >= 0.50) {
                              used[j] = true
                              val keepStrength = cur.isStrength || other.isStrength
                              val primary = when {
                                  keepStrength && other.sourceSummary.contains("Speediance", true) -> other
                                  keepStrength && cur.sourceSummary.contains("Speediance", true) -> cur
                                  other.sourceSummary.contains("Zwift", true) -> other
                                  cur.sourceSummary.contains("Zwift", true) -> cur
                                  other.sourceSummary.contains("Garmin", true) -> other
                                  else -> cur
                              }
                              val secondary = if (primary === cur) other else cur
                              val manualMuscles = prefs.getStringSet("muscles_${primary.id}", emptySet()) ?: emptySet()
                              val finalMuscles = if (manualMuscles.isNotEmpty()) {
                                  manualMuscles.mapNotNull { n -> MuscleGroup.values().firstOrNull { it.name == n } }.toSet()
                              } else (primary.muscleGroups + secondary.muscleGroups)

                              if (primary.endTime >= filterStart) {
                                  logs.add("Fusioniert: '${primary.title}' (${primary.sourceSummary} + ${secondary.sourceSummary})")
                              }
                              cur = primary.copy(
                                  avgHeartRate = primary.avgHeartRate ?: secondary.avgHeartRate,
                                  maxHeartRate = primary.maxHeartRate ?: secondary.maxHeartRate,
                                  hrCurve = if (primary.hrCurve.size >= 2) primary.hrCurve else secondary.hrCurve,
                                  zoneMinutes = if (primary.zoneMinutes.isNotEmpty()) primary.zoneMinutes else secondary.zoneMinutes,
                                  sourceSummary = "${primary.sourceSummary} + ${secondary.sourceSummary}",
                                  isStrength = keepStrength,
                                  muscleGroups = finalMuscles
                              )
                          }
                      }
                      val savedMuscles = prefs.getStringSet("muscles_${cur.id}", emptySet()) ?: emptySet()
                      if (savedMuscles.isNotEmpty()) {
                          cur = cur.copy(muscleGroups = savedMuscles.mapNotNull { n -> MuscleGroup.values().firstOrNull { it.name == n } }.toSet())
                      }
                      merged.add(cur)
                  }
                  return merged
              }

              private fun saveAndLoadArchive(prefs: android.content.SharedPreferences, fresh: List<UnifiedWorkout>): List<UnifiedWorkout> {
                  val map = LinkedHashMap<String, UnifiedWorkout>()
                  prefs.getString("workout_archive_v4", null)?.let { raw ->
                      try {
                          val arr = JSONArray(raw)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              val id = o.getString("id")
                              val mgs = mutableSetOf<MuscleGroup>()
                              o.optJSONArray("muscles")?.let { ma -> for (k in 0 until ma.length()) MuscleGroup.values().firstOrNull { it.name == ma.getString(k) }?.let { mgs.add(it) } }
                              val curve = mutableListOf<Int>().apply { o.optJSONArray("curve")?.let { ca -> for (k in 0 until ca.length()) add(ca.getInt(k)) } }
                              val zones = mutableListOf<Int>().apply { o.optJSONArray("zones")?.let { za -> for (k in 0 until za.length()) add(za.getInt(k)) } }
                              map[id] = UnifiedWorkout(
                                  id, o.getString("date"), o.getString("title"),
                                  Instant.ofEpochSecond(o.getLong("s")), Instant.ofEpochSecond(o.getLong("e")),
                                  o.getLong("dur"), o.optInt("avgHr").takeIf { it > 0 }, o.optInt("maxHr").takeIf { it > 0 },
                                  o.optInt("avgW").takeIf { it > 0 }, o.optInt("npW").takeIf { it > 0 }, o.optDouble("dist").takeIf { !it.isNaN() && it > 0.0 },
                                  curve, zones, o.getInt("kcal"), o.optDouble("strain", 5.0), o.getString("src"), o.getBoolean("str"), o.getBoolean("nonStep"), mgs
                              )
                          }
                      } catch (_: Exception) { }
                  }
                  for (w in fresh) map[w.id] = w
                  val all = map.values.sortedBy { it.startTime }
                  val out = JSONArray()
                  for (w in all) {
                      out.put(JSONObject().put("id", w.id).put("date", w.dateLabel).put("title", w.title)
                          .put("s", w.startTime.epochSecond).put("e", w.endTime.epochSecond).put("dur", w.durationMinutes)
                          .put("avgHr", w.avgHeartRate ?: 0).put("maxHr", w.maxHeartRate ?: 0)
                          .put("avgW", w.avgWatts ?: 0).put("npW", w.normalizedWatts ?: 0).put("dist", w.distanceKm ?: 0.0)
                          .put("curve", JSONArray(w.hrCurve)).put("zones", JSONArray(w.zoneMinutes))
                          .put("kcal", w.activeKcal).put("strain", w.strainScore).put("src", w.sourceSummary)
                          .put("str", w.isStrength).put("nonStep", w.isNonStepActivity).put("muscles", JSONArray(w.muscleGroups.map { it.name })))
                  }
                  prefs.edit().putString("workout_archive_v4", out.toString()).apply()
                  return all
              }

              private fun buildSleep(hcSleep: List<SleepSessionRecord>, icuDays: List<IntervalsWellnessDay>, startOfToday: Instant, zone: ZoneId): SleepDetail? {
                  val lastNight = hcSleep.filter { it.endTime >= startOfToday.minus(Duration.ofHours(16)) }
                      .maxByOrNull { Duration.between(it.startTime, it.endTime).toMinutes() }
                  val icuLatestSleep = icuDays.sortedByDescending { it.dateIso }.firstOrNull { it.sleepMinutes != null }

                  val totalMin = icuLatestSleep?.sleepMinutes ?: lastNight?.let { Duration.between(it.startTime, it.endTime).toMinutes() } ?: return null
                  var deep = 0L; var rem = 0L; var light = 0L; var awake = 0L
                  if (lastNight != null) {
                      for (st in lastNight.stages) {
                          val m = Duration.between(st.startTime, st.endTime).toMinutes().coerceAtLeast(0L)
                          when (st.stage) {
                              SleepSessionRecord.STAGE_TYPE_DEEP -> deep += m
                              SleepSessionRecord.STAGE_TYPE_REM -> rem += m
                              SleepSessionRecord.STAGE_TYPE_AWAKE, SleepSessionRecord.STAGE_TYPE_OUT_OF_BED -> awake += m
                              else -> light += m
                          }
                      }
                  }
                  if (deep + rem + light == 0L) {
                      deep = (totalMin * 0.20).roundToInt().toLong()
                      rem = (totalMin * 0.23).roundToInt().toLong()
                      light = (totalMin - deep - rem).coerceAtLeast(1L)
                  }
                  val eff = ((totalMin.toDouble() / (totalMin + awake).coerceAtLeast(1L)) * 100.0).roundToInt().coerceIn(55, 99)
                  val perf = ((totalMin / 450.0) * 100.0).roundToInt().coerceIn(25, 100)
                  val src = if (icuLatestSleep != null) "Garmin + Fitbit Phasen" else "Fitbit Air"

                  val daily7d = buildSeries(7, zone) { s, e ->
                      val dStr = LocalDate.ofInstant(s.plusSeconds(3600), zone).toString()
                      icuDays.firstOrNull { it.dateIso == dStr }?.sleepMinutes?.let { it / 60f }
                          ?: hcSleep.firstOrNull { it.endTime in s..e }?.let { Duration.between(it.startTime, it.endTime).toMinutes() / 60f }
                  }
                  return SleepDetail(totalMin, deep, rem, light, awake, eff, perf, src, daily7d)
              }

              private fun filterSteps(steps: List<StepsRecord>, workouts: List<UnifiedWorkout>): Long {
                  val sorted = steps.sortedBy { it.startTime }
                  val accepted = mutableListOf<StepsRecord>()
                  for (r in sorted) {
                      val dur = Duration.between(r.startTime, r.endTime).toMinutes().coerceAtLeast(1L)
                      if (r.count / dur > 260L || workouts.any { it.isNonStepActivity && overlap(it.startTime, it.endTime, r.startTime, r.endTime) >= 0.70 }) continue
                      if (accepted.any { overlap(it.startTime, it.endTime, r.startTime, r.endTime) >= 0.50 }) continue
                      accepted.add(r)
                  }
                  return accepted.sumOf { it.count }
              }

              private fun deduplicateCalories(cals: List<ActiveCaloriesBurnedRecord>, workouts: List<UnifiedWorkout>): Int {
                  val accepted = mutableListOf<ActiveCaloriesBurnedRecord>()
                  for (r in cals.sortedBy { it.startTime }) {
                      val k = r.energy.inKilocalories.roundToInt()
                      if (k !in 1..3000) continue
                      if (accepted.any { overlap(it.startTime, it.endTime, r.startTime, r.endTime) >= 0.50 }) continue
                      accepted.add(r)
                  }
                  return maxOf(accepted.sumOf { it.energy.inKilocalories.roundToInt() }, workouts.sumOf { it.activeKcal })
              }

              private fun computeRecovery(rhr: Int?, hrv: Double?, sleepPerf: Int?, todayWorkouts: List<UnifiedWorkout>): Int {
                  var rec = 62.0
                  if (hrv != null) rec += ((hrv - 42.0) * 0.45).coerceIn(-20.0, 20.0)
                  if (rhr != null) rec += ((61 - rhr) * 0.9).coerceIn(-18.0, 15.0)
                  if (sleepPerf != null) rec += ((sleepPerf - 80) * 0.35).coerceIn(-15.0, 10.0)
                  if (todayWorkouts.sumOf { it.durationMinutes } > 90) rec -= 6.0
                  return rec.roundToInt().coerceIn(12, 98)
              }

              private fun computeStrain(todayWorkouts: List<UnifiedWorkout>, steps: Long, isToday: Boolean): Double {
                  val w = todayWorkouts.sumOf { it.strainScore }
                  val s = if (isToday) (steps / 4000.0).coerceAtMost(4.5) else 2.0
                  return ((w * 0.85 + s).coerceIn(0.5, 20.8) * 10.0).roundToInt() / 10.0
              }

              private fun downsample(vals: List<Int>, n: Int): List<Int> =
                  if (vals.size <= n) vals else (0 until n).map { vals[(it * (vals.size.toDouble() / n)).toInt().coerceIn(0, vals.lastIndex)] }

              private fun computeZones(vals: List<Int>, totalMin: Int, maxHr: Int): List<Int> {
                  if (vals.isEmpty()) return emptyList()
                  val c = IntArray(5)
                  for (b in vals) {
                      val p = b.toDouble() / maxHr
                      when { p < 0.60 -> c[0]++; p < 0.70 -> c[1]++; p < 0.80 -> c[2]++; p < 0.90 -> c[3]++; else -> c[4]++ }
                  }
                  return c.map { ((it.toDouble() / vals.size) * totalMin).roundToInt() }
              }

              private fun buildSeries(days: Int, zone: ZoneId, fn: (Instant, Instant) -> Float?): List<Pair<String, Float>> {
                  val fmt = DateTimeFormatter.ofPattern("dd.MM")
                  val today = LocalDate.now()
                  return (days - 1 downTo 0).map { off ->
                      val d = today.minusDays(off.toLong())
                      d.format(fmt) to (fn(d.atStartOfDay(zone).toInstant(), d.plusDays(1).atStartOfDay(zone).toInstant()) ?: 0f)
                  }
              }

              private fun overlap(s1: Instant, e1: Instant, s2: Instant, e2: Instant): Double {
                  val sec = Duration.between(maxOf(s1, s2), minOf(e1, e2)).seconds
                  if (sec <= 0L) return 0.0
                  return sec.toDouble() / min(Duration.between(s1, e1).seconds.coerceAtLeast(1L), Duration.between(s2, e2).seconds.coerceAtLeast(1L)).toDouble()
              }
          }
