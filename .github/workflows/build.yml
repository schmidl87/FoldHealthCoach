              private fun updateTabHighlight() {
                  tabButtons.forEachIndexed { idx, tv ->
                      val sel = idx == activeTab
                      tv.setTextColor(if (sel) Color.WHITE else Color.parseColor("#7D8590"))
                      tv.setTypeface(null, if (sel) Typeface.BOLD else Typeface.NORMAL)
                      tv.background = if (sel) pillBg("#1A2433", "#2997FF") else null
                  }
              }

              private fun checkPermissionsAndLoad() {
                  if (HealthConnectClient.getSdkStatus(this) != HealthConnectClient.SDK_AVAILABLE) {
                      headerSubtitle.text = "Health Connect nicht installiert"
                      return
                  }
                  lifecycleScope.launch {
                      val granted = HealthConnectClient.getOrCreate(this@MainActivity).permissionController.getGrantedPermissions()
                      if (granted.size >= 4) refreshHealthData()
                      else headerSubtitle.text = "Bitte unter 'Gesundheit' Health Connect verbinden"
                  }
              }

              private fun refreshHealthData() {
                  val prefs = getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  val age = prefs.getInt("user_age", 39)
                  headerSubtitle.text = "Synchronisiere Garmin, Speediance & Zwift..."
                  lifecycleScope.launch {
                      try {
                          val rep = fusionEngine.buildReport(age, selectedRange)
                          currentReport = rep
                          headerSubtitle.text = "Stand ${rep.generatedDateLabel} • Archiv: ${rep.allHistoricalWorkoutsCount} Trainings"
                          renderActiveTab()
                          currentAiText = coachClient.generateInsight(prefs.getString("gemini_api_key", "") ?: "", rep)
                          if (activeTab == 0) renderActiveTab()
                      } catch (e: Exception) {
                          headerSubtitle.text = "Hinweis: ${e.message}"
                      }
                  }
              }
