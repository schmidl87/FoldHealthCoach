                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/HealthModelsAndAnalyzer.kt
          package de.fold8.healthcoach

          import androidx.health.connect.client.records.ExerciseSegment
          import androidx.health.connect.client.records.ExerciseSessionRecord
          import java.time.Instant
          import kotlin.math.roundToInt

          enum class DataSource(val label: String, val cardioPriority: Int) {
              GARMIN("Garmin", 4),
              ZWIFT("Zwift", 3),
              SPEEDIANCE("Speediance", 2),
              GOOGLE_SAMSUNG("Google / Samsung Health", 1),
              OTHER("Andere App", 0)
          }

          enum class TimeRangeOption(val label: String, val days: Long) {
              TODAY("Heute", 1L),
              DAYS_7("7 Tage", 7L),
              DAYS_30("30 Tage", 30L),
              ALL_90("Gesamt (90T)", 90L)
          }

          enum class MuscleGroup(val label: String) {
              CHEST("Brust"),
              BACK("Rücken"),
              SHOULDERS("Schultern"),
              LEGS("Beine"),
              ARMS("Arme"),
              CORE("Core")
          }

          data class UnifiedWorkout(
              val id: String,
              val dateLabel: String,
              val title: String,
              val startTime: Instant,
              val endTime: Instant,
              val durationMinutes: Long,
              val avgHeartRate: Int?,
              val maxHeartRate: Int?,
              val activeKcal: Int,
              val sourceSummary: String,
              val isStrength: Boolean,
              val isNonStepActivity: Boolean,
              val muscleGroups: Set<MuscleGroup>
          )

          data class FitnessProfile(
              val chronologicalAge: Int,
              val fitnessAge: Int,
              val ageDelta: Int,
              val fitnessScore: Int,
              val fitnessLevelLabel: String,
              val vo2Max: Double?,
              val avgRestingHr30d: Int?,
              val avgWeeklyCardioMinutes: Long,
              val avgWeeklyStrengthSessions: Double,
              val explanation: String
          )

          data class HealthReport(
              val generatedDateLabel: String,
              val selectedRange: TimeRangeOption,
              val periodSteps: Long,
              val periodRawSteps: Long,
              val periodActiveKcal: Int,
              val latestRestingHr: Int?,
              val latestSleepHours: Double?,
              val filteredWorkouts: List<UnifiedWorkout>,
              val allHistoricalWorkoutsCount: Int,
              val periodMuscleSets: Map<MuscleGroup, Int>,
              val auditLogs: List<String>,
              val recoveryScore: Int,
              val fitnessProfile: FitnessProfile
          )

          object MuscleAndFitnessAnalyzer {

              fun detectMuscleGroups(
                  base: ExerciseSessionRecord,
                  partner: ExerciseSessionRecord?,
                  manualOverrideNames: Set<String>
              ): Set<MuscleGroup> {
                  if (manualOverrideNames.isNotEmpty()) {
                      return manualOverrideNames.mapNotNull { name ->
                          MuscleGroup.values().firstOrNull { it.name == name }
                      }.toSet()
                  }

                  val found = mutableSetOf<MuscleGroup>()
                  val allSegments = base.segments + (partner?.segments ?: emptyList())

                  for (seg in allSegments) {
                      when (seg.segmentType) {
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_BENCH_PRESS,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_PUSH_UP -> found.add(MuscleGroup.CHEST)

                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_LAT_PULLDOWN,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_PULL_UP,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_DEADLIFT -> found.add(MuscleGroup.BACK)

                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_SHOULDER_PRESS -> found.add(MuscleGroup.SHOULDERS)

                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_SQUAT,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_LUNGE,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_LEG_PRESS,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_LEG_EXTENSION,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_LEG_CURL -> found.add(MuscleGroup.LEGS)

                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_BICEPS_CURL,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_TRICEPS_EXTENSION -> found.add(MuscleGroup.ARMS)

                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_CRUNCH,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_PLANK,
                          ExerciseSegment.EXERCISE_SEGMENT_TYPE_SIT_UP -> found.add(MuscleGroup.CORE)
                      }
                  }

                  val text = listOfNotNull(base.title, base.notes, partner?.title, partner?.notes)
                      .joinToString(" ")
                      .lowercase()

                  if (text.contains("brust") || text.contains("chest") || text.contains("push") || text.contains("bankdrück")) found.add(MuscleGroup.CHEST)
                  if (text.contains("rücken") || text.contains("back") || text.contains("pull") || text.contains("lat") || text.contains("ruder") || text.contains("kreuzheb")) found.add(MuscleGroup.BACK)
                  if (text.contains("schulter") || text.contains("shoulder") || text.contains("delts")) found.add(MuscleGroup.SHOULDERS)
                  if (text.contains("bein") || text.contains("leg") || text.contains("squat") || text.contains("kniebeug")) found.add(MuscleGroup.LEGS)
                  if (text.contains("arm") || text.contains("bizeps") || text.contains("trizeps") || text.contains("bicep") || text.contains("tricep") || text.contains("curl")) found.add(MuscleGroup.ARMS)
                  if (text.contains("core") || text.contains("bauch") || text.contains("abs") || text.contains("plank")) found.add(MuscleGroup.CORE)
                  if (text.contains("oberkörper") || text.contains("upper")) found.addAll(listOf(MuscleGroup.CHEST, MuscleGroup.BACK, MuscleGroup.SHOULDERS, MuscleGroup.ARMS))
                  if (text.contains("unterkörper") || text.contains("lower")) found.addAll(listOf(MuscleGroup.LEGS, MuscleGroup.CORE))
                  if (text.contains("ganzkörper") || text.contains("full body")) found.addAll(MuscleGroup.values().toList())

                  return found
              }

              fun calculateFitnessProfile(
                  chronologicalAge: Int,
                  vo2Max: Double?,
                  avgRestingHr30d: Int?,
                  workouts30d: List<UnifiedWorkout>,
                  avgDailySteps30d: Long
              ): FitnessProfile {
                  val weeksFactor = 30.0 / 7.0
                  val avgWeeklyStrength = (workouts30d.count { it.isStrength } / weeksFactor)
                  val avgWeeklyCardioMin = (workouts30d.filter { !it.isStrength }.sumOf { it.durationMinutes } / weeksFactor).roundToInt().toLong()

                  var score = 50
                  var ageAdjustment = 0.0
                  val reasons = mutableListOf<String>()

                  if (vo2Max != null && vo2Max > 20.0) {
                      val expectedVo2 = (56.0 - chronologicalAge * 0.35).coerceAtLeast(30.0)
                      val vo2Diff = vo2Max - expectedVo2
                      ageAdjustment -= (vo2Diff * 0.65)
                      score += (vo2Diff * 1.8).roundToInt()
                      reasons.add("VO2max ${"%.1f".format(vo2Max)}")
                  }

                  if (avgRestingHr30d != null && avgRestingHr30d in 35..110) {
                      val hrDiff = 63 - avgRestingHr30d
                      ageAdjustment -= (hrDiff * 0.35)
                      score += (hrDiff * 1.1).roundToInt()
                      reasons.add("Ø Ruhepuls $avgRestingHr30d bpm")
                  }

                  val cardioBonus = (avgWeeklyCardioMin / 30.0).coerceAtMost(6.0)
                  ageAdjustment -= cardioBonus * 0.5
                  score += (cardioBonus * 3.0).roundToInt()

                  val strengthBonus = avgWeeklyStrength.coerceAtMost(5.0)
                  ageAdjustment -= strengthBonus * 0.65
                  score += (strengthBonus * 4.0).roundToInt()

                  if (avgDailySteps30d >= 8000L) {
                      ageAdjustment -= 1.5
                      score += 6
                  } else if (avgDailySteps30d < 4000L) {
                      ageAdjustment += 1.5
                      score -= 5
                  }

                  val strengthFormatted = "%.1f".format(avgWeeklyStrength)
                  reasons.add("Ø $avgWeeklyCardioMin Min. Cardio + ${strengthFormatted}× Kraft/Woche")

                  val clampedScore = score.coerceIn(15, 99)
                  val clampedAdj = ageAdjustment.roundToInt().coerceIn(-12, 10)
                  val fitnessAge = (chronologicalAge + clampedAdj).coerceAtLeast(18)

                  val levelLabel = when {
                      clampedScore >= 90 -> "Elite"
                      clampedScore >= 75 -> "Athlet"
                      clampedScore >= 60 -> "Fortgeschritten"
                      clampedScore >= 42 -> "Aktiv"
                      else -> "Einsteiger"
                  }

                  return FitnessProfile(
                      chronologicalAge = chronologicalAge,
                      fitnessAge = fitnessAge,
                      ageDelta = clampedAdj,
                      fitnessScore = clampedScore,
                      fitnessLevelLabel = levelLabel,
                      vo2Max = vo2Max,
                      avgRestingHr30d = avgRestingHr30d,
                      avgWeeklyCardioMinutes = avgWeeklyCardioMin,
                      avgWeeklyStrengthSessions = (avgWeeklyStrength * 10.0).roundToInt() / 10.0,
                      explanation = reasons.joinToString(" • ")
                  )
              }
          }
          EOF
                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/HealthFusionEngine.kt
          package de.fold8.healthcoach

          import android.content.Context
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.*
          import androidx.health.connect.client.request.ReadRecordsRequest
          import androidx.health.connect.client.time.TimeRangeFilter
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.Duration
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import kotlin.math.min
          import kotlin.math.roundToInt

          class HealthFusionEngine(private val context: Context) {

              companion object {
                  const val PERMISSION_HISTORY = "android.permission.health.READ_HEALTH_DATA_HISTORY"

                  val REQUIRED_PERMISSIONS = setOf(
                      HealthPermission.getReadPermission(StepsRecord::class),
                      HealthPermission.getReadPermission(ExerciseSessionRecord::class),
                      HealthPermission.getReadPermission(HeartRateRecord::class),
                      HealthPermission.getReadPermission(RestingHeartRateRecord::class),
                      HealthPermission.getReadPermission(SleepSessionRecord::class),
                      HealthPermission.getReadPermission(ActiveCaloriesBurnedRecord::class),
                      HealthPermission.getReadPermission(Vo2MaxRecord::class),
                      PERMISSION_HISTORY
                  )
              }

              private fun classifySource(packageName: String, titleOrNotes: String = ""): DataSource {
                  val pkg = packageName.lowercase()
                  val text = titleOrNotes.lowercase()
                  return when {
                      pkg.contains("zwift") || isZwiftText(text) -> DataSource.ZWIFT
                      pkg.contains("garmin") -> DataSource.GARMIN
                      pkg.contains("speediance") -> DataSource.SPEEDIANCE
                      pkg.contains("google") || pkg.contains("healthdata") || pkg.contains("fit") ||
                              pkg.contains("shealth") || pkg.contains("samsung") -> DataSource.GOOGLE_SAMSUNG
                      else -> DataSource.OTHER
                  }
              }

              private fun isZwiftText(text: String): Boolean {
                  return listOf(
                      "zwift", "watopia", "makuri", "innsbruck", "richmond",
                      "yorkshire", "crit city", "bologna", "virtual ride", "virtuelle radfahrt"
                  ).any { text.contains(it) }
              }

              suspend fun buildReport(chronologicalAge: Int, range: TimeRangeOption): HealthReport {
                  val client = HealthConnectClient.getOrCreate(context)
                  val prefs = context.getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  val zone = ZoneId.systemDefault()
                  val now = Instant.now()
                  val startOfToday = LocalDate.now().atStartOfDay(zone).toInstant()
                  val historyStart = startOfToday.minus(Duration.ofDays(89))
                  val filterStart = if (range == TimeRangeOption.TODAY) startOfToday
                  else startOfToday.minus(Duration.ofDays(range.days - 1))
                  val sleepLookback = startOfToday.minus(Duration.ofHours(14))
                  val logs = mutableListOf<String>()

                  val rawWorkouts90d = client.readRecords(
                      ReadRecordsRequest(ExerciseSessionRecord::class, TimeRangeFilter.between(historyStart, now))
                  ).records
                  val rawHr90d = client.readRecords(
                      ReadRecordsRequest(HeartRateRecord::class, TimeRangeFilter.between(historyStart, now))
                  ).records
                  val rawCalories90d = client.readRecords(
                      ReadRecordsRequest(ActiveCaloriesBurnedRecord::class, TimeRangeFilter.between(historyStart, now))
                  ).records
                  val rawSteps90d = client.readRecords(
                      ReadRecordsRequest(StepsRecord::class, TimeRangeFilter.between(historyStart, now))
                  ).records
                  val rawRestingHr30d = client.readRecords(
                      ReadRecordsRequest(RestingHeartRateRecord::class, TimeRangeFilter.between(startOfToday.minus(Duration.ofDays(30)), now))
                  ).records
                  val rawSleepLatest = client.readRecords(
                      ReadRecordsRequest(SleepSessionRecord::class, TimeRangeFilter.between(sleepLookback, now))
                  ).records

                  val vo2Max = try {
                      client.readRecords(
                          ReadRecordsRequest(Vo2MaxRecord::class, TimeRangeFilter.between(historyStart, now))
                      ).records
                          .sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }
                          .firstOrNull()?.vo2MillilitersPerMinuteKilogram
                  } catch (_: Exception) { null }

                  // Alle 90 Tage fusionieren & lokal im Archiv sichern
                  val liveMerged90d = mergeWorkouts(rawWorkouts90d, rawHr90d, rawCalories90d, prefs, logs, filterStart)
                  val archivedMerged = saveAndMergeLocalArchive(prefs, liveMerged90d)

                  val filteredWorkouts = archivedMerged.filter { it.endTime >= filterStart }
                  val workouts30d = archivedMerged.filter { it.endTime >= startOfToday.minus(Duration.ofDays(30)) }
                  val todayWorkouts = archivedMerged.filter { it.endTime >= startOfToday }

                  val periodStepsRaw = rawSteps90d.filter { it.endTime >= filterStart }
                  val periodRawStepsCount = periodStepsRaw.sumOf { it.count }
                  val periodCleanSteps = filterAndDeduplicateSteps(periodStepsRaw, filteredWorkouts, logs, recordLogs = true)

                  val steps30dClean = filterAndDeduplicateSteps(
                      rawSteps90d.filter { it.endTime >= startOfToday.minus(Duration.ofDays(30)) },
                      workouts30d, mutableListOf(), recordLogs = false
                  )
                  val avgDailySteps30d = steps30dClean / 30L

                  val periodCalRaw = rawCalories90d.filter { it.endTime >= filterStart }
                  val periodCleanKcal = deduplicateCalories(periodCalRaw, filteredWorkouts, logs)

                  val garminFirstResting = rawRestingHr30d
                      .sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }
                  val latestRestingHr = garminFirstResting.firstOrNull()?.beatsPerMinute?.toInt()
                  val avgRestingHr30d = if (garminFirstResting.isNotEmpty()) {
                      garminFirstResting.map { it.beatsPerMinute.toInt() }.average().roundToInt()
                  } else null

                  val latestSleepHours = deduplicateSleepHours(rawSleepLatest, logs)
                  val recoveryScore = calculateRecoveryScore(latestRestingHr, latestSleepHours, todayWorkouts)

                  val fitnessProfile = MuscleAndFitnessAnalyzer.calculateFitnessProfile(
                      chronologicalAge = chronologicalAge,
                      vo2Max = vo2Max,
                      avgRestingHr30d = avgRestingHr30d,
                      workouts30d = workouts30d,
                      avgDailySteps30d = avgDailySteps30d
                  )

                  val muscleSets = mutableMapOf<MuscleGroup, Int>()
                  MuscleGroup.values().forEach { muscleSets[it] = 0 }
                  for (w in filteredWorkouts) {
                      for (mg in w.muscleGroups) {
                          muscleSets[mg] = (muscleSets[mg] ?: 0) + 1
                      }
                  }

                  if (logs.isEmpty()) {
                      logs.add("Garmin-, Zwift- & Speediance-Regeln aktiv: Keine Duplikate im Zeitraum (${range.label}).")
                  }

                  val dateLabel = LocalDate.now().format(DateTimeFormatter.ofPattern("dd.MM.yyyy"))
                  return HealthReport(
                      generatedDateLabel = dateLabel,
                      selectedRange = range,
                      periodSteps = periodCleanSteps,
                      periodRawSteps = periodRawStepsCount,
                      periodActiveKcal = periodCleanKcal,
                      latestRestingHr = latestRestingHr,
                      latestSleepHours = latestSleepHours,
                      filteredWorkouts = filteredWorkouts,
                      allHistoricalWorkoutsCount = archivedMerged.size,
                      periodMuscleSets = muscleSets,
                      auditLogs = logs,
                      recoveryScore = recoveryScore,
                      fitnessProfile = fitnessProfile
                  )
              }

              private fun saveAndMergeLocalArchive(
                  prefs: android.content.SharedPreferences,
                  freshWorkouts: List<UnifiedWorkout>
              ): List<UnifiedWorkout> {
                  val map = LinkedHashMap<String, UnifiedWorkout>()
                  val rawJson = prefs.getString("workout_archive_json", null)
                  if (!rawJson.isNullOrBlank()) {
                      try {
                          val arr = JSONArray(rawJson)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              val id = o.getString("id")
                              val mgSet = mutableSetOf<MuscleGroup>()
                              val mgArr = o.optJSONArray("muscles") ?: JSONArray()
                              for (m in 0 until mgArr.length()) {
                                  MuscleGroup.values().firstOrNull { it.name == mgArr.getString(m) }?.let { mgSet.add(it) }
                              }
                              map[id] = UnifiedWorkout(
                                  id = id,
                                  dateLabel = o.getString("dateLabel"),
                                  title = o.getString("title"),
                                  startTime = Instant.ofEpochSecond(o.getLong("startSec")),
                                  endTime = Instant.ofEpochSecond(o.getLong("endSec")),
                                  durationMinutes = o.getLong("durMin"),
                                  avgHeartRate = if (o.has("avgHr") && !o.isNull("avgHr")) o.getInt("avgHr") else null,
                                  maxHeartRate = if (o.has("maxHr") && !o.isNull("maxHr")) o.getInt("maxHr") else null,
                                  activeKcal = o.getInt("kcal"),
                                  sourceSummary = o.getString("source"),
                                  isStrength = o.getBoolean("isStrength"),
                                  isNonStepActivity = o.getBoolean("isNonStep"),
                                  muscleGroups = mgSet
                              )
                          }
                      } catch (_: Exception) { }
                  }

                  for (w in freshWorkouts) {
                      map[w.id] = w
                  }

                  val sortedAll = map.values.sortedBy { it.startTime }
                  val outArr = JSONArray()
                  for (w in sortedAll) {
                      val mgArr = JSONArray()
                      w.muscleGroups.forEach { mgArr.put(it.name) }
                      outArr.put(
                          JSONObject()
                              .put("id", w.id)
                              .put("dateLabel", w.dateLabel)
                              .put("title", w.title)
                              .put("startSec", w.startTime.epochSecond)
                              .put("endSec", w.endTime.epochSecond)
                              .put("durMin", w.durationMinutes)
                              .put("avgHr", w.avgHeartRate)
                              .put("maxHr", w.maxHeartRate)
                              .put("kcal", w.activeKcal)
                              .put("source", w.sourceSummary)
                              .put("isStrength", w.isStrength)
                              .put("isNonStep", w.isNonStepActivity)
                              .put("muscles", mgArr)
                      )
                  }
                  prefs.edit().putString("workout_archive_json", outArr.toString()).apply()
                  return sortedAll
              }

              private fun mergeWorkouts(
                  sessions: List<ExerciseSessionRecord>,
                  hrRecords: List<HeartRateRecord>,
                  calRecords: List<ActiveCaloriesBurnedRecord>,
                  prefs: android.content.SharedPreferences,
                  logs: MutableList<String>,
                  filterStart: Instant
              ): List<UnifiedWorkout> {
                  val sorted = sessions.sortedBy { it.startTime }
                  val used = BooleanArray(sorted.size)
                  val result = mutableListOf<UnifiedWorkout>()
                  val dateFmt = DateTimeFormatter.ofPattern("dd.MM.").withZone(ZoneId.systemDefault())

                  for (i in sorted.indices) {
                      if (used[i]) continue
                      val base = sorted[i]
                      val baseSrc = classifySource(base.metadata.dataOrigin.packageName, "${base.title ?: ""} ${base.notes ?: ""}")
                      var partner: ExerciseSessionRecord? = null
                      var partnerSrc: DataSource? = null

                      for (j in i + 1 until sorted.size) {
                          if (used[j]) continue
                          val candidate = sorted[j]
                          if (overlapRatio(base.startTime, base.endTime, candidate.startTime, candidate.endTime) >= 0.50) {
                              used[j] = true
                              partner = candidate
                              partnerSrc = classifySource(candidate.metadata.dataOrigin.packageName, "${candidate.title ?: ""} ${candidate.notes ?: ""}")
                              break
                          }
                      }

                      val isStrength = isStrengthSession(base, baseSrc) || (partner != null && partnerSrc != null && isStrengthSession(partner, partnerSrc))

                      val primary: ExerciseSessionRecord
                      val secondary: ExerciseSessionRecord?
                      val primarySrc: DataSource
                      val secondarySrc: DataSource?

                      if (partner != null && partnerSrc != null) {
                          val swapToPartner = if (isStrength) {
                              partnerSrc == DataSource.SPEEDIANCE && baseSrc != DataSource.SPEEDIANCE
                          } else {
                              partnerSrc.cardioPriority > baseSrc.cardioPriority
                          }
                          if (swapToPartner) {
                              primary = partner; primarySrc = partnerSrc
                              secondary = base; secondarySrc = baseSrc
                          } else {
                              primary = base; primarySrc = baseSrc
                              secondary = partner; secondarySrc = partnerSrc
                          }
                      } else {
                          primary = base; primarySrc = baseSrc
                          secondary = null; secondarySrc = null
                      }

                      val start = if (secondary != null) minOf(primary.startTime, secondary.startTime) else primary.startTime
                      val end = if (secondary != null) maxOf(primary.endTime, secondary.endTime) else primary.endTime
                      val durationMin = Duration.between(start, end).toMinutes().coerceAtLeast(1L)
                      val workoutId = "w_${start.epochSecond}_${durationMin}"

                      val title = resolveWorkoutTitle(primary, secondary, primarySrc, secondarySrc, isStrength)
                      val manualMuscles = prefs.getStringSet("muscles_$workoutId", emptySet()) ?: emptySet()
                      val muscles = MuscleAndFitnessAnalyzer.detectMuscleGroups(primary, secondary, manualMuscles)

                      val windowHrSamples = hrRecords
                          .filter { it.endTime >= start && it.startTime <= end }
                          .sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }
                          .flatMap { it.samples }
                          .filter { it.time in start..end }
                          .map { it.beatsPerMinute.toInt() }

                      val avgHr = if (windowHrSamples.isNotEmpty()) windowHrSamples.average().roundToInt() else null
                      val maxHr = windowHrSamples.maxOrNull()

                      val workoutCalRecords = calRecords.filter {
                          overlapRatio(start, end, it.startTime, it.endTime) >= 0.50
                      }.sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }

                      val kcal = workoutCalRecords
                          .map { it.energy.inKilocalories.roundToInt() }
                          .firstOrNull { it in 10..2500 }
                          ?: (durationMin * 6).toInt()

                      val sourceSummary = if (secondary != null && secondarySrc != null) {
                          if (end >= filterStart) {
                              logs.add("Fusioniert: '$title' (${primarySrc.label} + ${secondarySrc.label}) → nicht doppelt gezählt.")
                          }
                          "${primarySrc.label} + ${secondarySrc.label} (fusioniert)"
                      } else {
                          primarySrc.label
                      }

                      val isNonStep = isStrength || primarySrc == DataSource.ZWIFT || primary.exerciseType in setOf(
                          ExerciseSessionRecord.EXERCISE_TYPE_BIKING,
                          ExerciseSessionRecord.EXERCISE_TYPE_BIKING_STATIONARY,
                          ExerciseSessionRecord.EXERCISE_TYPE_ROWING_MACHINE
                      )

                      result.add(
                          UnifiedWorkout(
                              workoutId, dateFmt.format(start), title, start, end, durationMin,
                              avgHr, maxHr, kcal, sourceSummary, isStrength, isNonStep, muscles
                          )
                      )
                  }
                  return result
              }

              private fun isStrengthSession(rec: ExerciseSessionRecord, src: DataSource): Boolean {
                  if (src == DataSource.SPEEDIANCE) return true
                  return rec.exerciseType in setOf(
                      ExerciseSessionRecord.EXERCISE_TYPE_STRENGTH_TRAINING,
                      ExerciseSessionRecord.EXERCISE_TYPE_WEIGHTLIFTING,
                      ExerciseSessionRecord.EXERCISE_TYPE_CALISTHENICS
                  )
              }

              private fun filterAndDeduplicateSteps(
                  steps: List<StepsRecord>,
                  workouts: List<UnifiedWorkout>,
                  logs: MutableList<String>,
                  recordLogs: Boolean
              ): Long {
                  val prioritized = steps.sortedWith(
                      compareByDescending<StepsRecord> { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }
                          .thenBy { it.startTime }
