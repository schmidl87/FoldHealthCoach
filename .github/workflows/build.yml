          package de.fold8.healthcoach

          import android.content.Context
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.*
          import androidx.health.connect.client.request.ReadRecordsRequest
          import androidx.health.connect.client.time.TimeRangeFilter
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.Duration
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import kotlin.math.ln
          import kotlin.math.min
          import kotlin.math.roundToInt

          class HealthFusionEngine(private val context: Context) {

              private val intervalsClient = IntervalsClient()

              companion object {
                  const val PERMISSION_HISTORY = "android.permission.health.READ_HEALTH_DATA_HISTORY"

                  val REQUIRED_PERMISSIONS = setOf(
                      HealthPermission.getReadPermission(StepsRecord::class),
                      HealthPermission.getReadPermission(ExerciseSessionRecord::class),
                      HealthPermission.getReadPermission(HeartRateRecord::class),
                      HealthPermission.getReadPermission(RestingHeartRateRecord::class),
                      HealthPermission.getReadPermission(HeartRateVariabilityRmssdRecord::class),
                      HealthPermission.getReadPermission(SleepSessionRecord::class),
                      HealthPermission.getReadPermission(ActiveCaloriesBurnedRecord::class),
                      HealthPermission.getReadPermission(SkinTemperatureRecord::class),
                      HealthPermission.getReadPermission(OxygenSaturationRecord::class),
                      HealthPermission.getReadPermission(RespiratoryRateRecord::class),
                      HealthPermission.getReadPermission(WeightRecord::class),
                      HealthPermission.getReadPermission(BodyFatRecord::class),
                      HealthPermission.getReadPermission(LeanBodyMassRecord::class),
                      HealthPermission.getReadPermission(BoneMassRecord::class),
                      HealthPermission.getReadPermission(BodyWaterMassRecord::class),
                      HealthPermission.getReadPermission(Vo2MaxRecord::class),
                      PERMISSION_HISTORY
                  )
              }

              private suspend inline fun <reified T : Record> readAll(client: HealthConnectClient, start: Instant, end: Instant): List<T> {
                  return try {
                      val list = mutableListOf<T>()
                      var token: String? = null
                      do {
                          val res = client.readRecords(ReadRecordsRequest(T::class, TimeRangeFilter.between(start, end), pageToken = token))
                          list.addAll(res.records)
                          token = res.pageToken
                      } while (token != null)
                      list
                  } catch (_: Exception) { emptyList() }
              }

              private fun classifyPkg(pkgRaw: String): DataSource {
                  val pkg = pkgRaw.lowercase()
                  return when {
                      pkg.contains("garmin") -> DataSource.GARMIN
                      pkg.contains("zwift") -> DataSource.ZWIFT
                      pkg.contains("speediance") -> DataSource.SPEEDIANCE
                      pkg.contains("withings") -> DataSource.WITHINGS
                      pkg.contains("fitbit") -> DataSource.FITBIT
                      else -> DataSource.OTHER
                  }
              }

              suspend fun buildReport(age: Int, range: TimeRangeOption, intervalsApiKey: String): HealthReport {
                  val client = HealthConnectClient.getOrCreate(context)
                  val prefs = context.getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  val zone = ZoneId.systemDefault()
                  val now = Instant.now()
                  val startOfToday = LocalDate.now().atStartOfDay(zone).toInstant()
                  val historyStart = startOfToday.minus(Duration.ofDays(89))
                  val filterStart = if (range == TimeRangeOption.TODAY) startOfToday else startOfToday.minus(Duration.ofDays(range.days - 1))
                  val logs = mutableListOf<String>()

                  // 1. Garmin & Zwift über Intervals.icu abrufen (hat höchste Priorität!)
                  val icuData = intervalsClient.fetchGarminAndZwift(intervalsApiKey, 89L, age)
                  if (intervalsApiKey.isNotBlank()) logs.add(icuData.statusNote)

                  // 2. Health Connect (Fitbit Air, Withings, Speediance) abrufen
                  val hcWorkouts = readAll<ExerciseSessionRecord>(client, historyStart, now)
                  val hcHr = readAll<HeartRateRecord>(client, historyStart, now)
                  val hcCal = readAll<ActiveCaloriesBurnedRecord>(client, historyStart, now)
                  val hcSteps = readAll<StepsRecord>(client, historyStart, now)
                  val hcRhr = readAll<RestingHeartRateRecord>(client, startOfToday.minus(Duration.ofDays(30)), now)
                  val hcHrv = readAll<HeartRateVariabilityRmssdRecord>(client, startOfToday.minus(Duration.ofDays(30)), now)
                  val hcSleep = readAll<SleepSessionRecord>(client, startOfToday.minus(Duration.ofDays(14)), now)
                  val hcSkinTemp = readAll<SkinTemperatureRecord>(client, startOfToday.minus(Duration.ofDays(14)), now)
                  val hcSpo2 = readAll<OxygenSaturationRecord>(client, startOfToday.minus(Duration.ofDays(7)), now)
                  val hcResp = readAll<RespiratoryRateRecord>(client, startOfToday.minus(Duration.ofDays(7)), now)
                  val hcVo2 = readAll<Vo2MaxRecord>(client, historyStart, now)

                  // 3. Withings Körperwerte
                  val bodyComp = readWithingsBodyComp(client, historyStart, now, icuData.wellnessDays, zone)

                  // 4. Trainings fusionieren (Speediance für Kraft, Garmin/Zwift für Ausdauer + Fitbit Puls-Kurve falls vorhanden)
                  val mergedLive = fuseAllWorkouts(icuData.workouts, hcWorkouts, hcHr, hcCal, prefs, logs, filterStart, age)
                  val archiveAll = saveAndLoadArchive(prefs, mergedLive)
                  val filteredWorkouts = archiveAll.filter { it.endTime >= filterStart }
                  val workouts30d = archiveAll.filter { it.endTime >= startOfToday.minus(Duration.ofDays(30)) }
                  val todayWorkouts = archiveAll.filter { it.endTime >= startOfToday }

                  // 5. Garmin vs. Fitbit Air Priorisierung & Vergleich
                  val latestIcu = icuData.wellnessDays.sortedByDescending { it.dateIso }.firstOrNull { it.restingHr != null || it.hrvRmssd != null || it.sleepMinutes != null }
                  val fitbitRhrRec = hcRhr.filter { it.beatsPerMinute in 38..125 }.maxByOrNull { it.time }
                  val fitbitHrvRec = hcHrv.filter { it.heartRateVariabilityMillis in 8.0..180.0 }.maxByOrNull { it.time }

                  val garminRhr = latestIcu?.restingHr
                  val fitbitRhr = fitbitRhrRec?.beatsPerMinute?.toInt()
                  val chosenRhr = garminRhr ?: fitbitRhr
                  val rhrSource = if (garminRhr != null) "Garmin (Intervals.icu)" else if (fitbitRhr != null) "Fitbit Air (Health Connect)" else "Keine Daten"

                  val garminHrv = latestIcu?.hrvRmssd
                  val fitbitHrv = fitbitHrvRec?.heartRateVariabilityMillis
                  val chosenHrv = garminHrv ?: fitbitHrv
                  val hrvSource = if (garminHrv != null) "Garmin (Intervals.icu)" else if (fitbitHrv != null) "Fitbit Air (Health Connect)" else "Keine Daten"

                  val vo2Max = icuData.wellnessDays.sortedByDescending { it.dateIso }.firstOrNull { it.vo2Max != null }?.vo2Max
                      ?: hcVo2.maxByOrNull { it.time }?.vo2MillilitersPerMinuteKilogram

                  // Schritte (Garmin bevorzugt, Fitbit als Vergleich)
                  val todayStr = LocalDate.now().toString()
                  val garminTodaySteps = icuData.wellnessDays.firstOrNull { it.dateIso == todayStr }?.steps
                  val hcStepsFiltered = filterSteps(hcSteps.filter { it.endTime >= filterStart }, filteredWorkouts)
                  val fitbitTodaySteps = filterSteps(hcSteps.filter { it.endTime >= startOfToday }, todayWorkouts)

                  val icuPeriodSteps = icuData.wellnessDays.filter {
                      try { !LocalDate.parse(it.dateIso).atStartOfDay(zone).toInstant().isBefore(filterStart) } catch (_: Exception) { false }
                  }.sumOf { it.steps ?: 0L }

                  val periodSteps = if (icuPeriodSteps > 0L) icuPeriodSteps else hcStepsFiltered
                  val stepsSource = if (icuPeriodSteps > 0L) "Garmin (priorisiert)" else "Fitbit Air (Health Connect)"

                  val steps30dAvg = (filterSteps(hcSteps.filter { it.endTime >= startOfToday.minus(Duration.ofDays(30)) }, workouts30d) / 30L)
                      .coerceAtLeast(icuData.wellnessDays.takeLast(30).mapNotNull { it.steps }.let { if (it.isEmpty()) 0L else it.average().toLong() })

                  val periodKcal = deduplicateCalories(hcCal.filter { it.endTime >= filterStart }, filteredWorkouts)

                  // Hauttemperatur, SpO2, Atemfrequenz (Fitbit Air / Health Connect + Garmin Wellness)
                  val skinDeltas = hcSkinTemp.flatMap { rec -> rec.deltas.map { it.time to it.delta.inCelsius } }.sortedBy { it.first }
                  val latestSkinTemp = skinDeltas.lastOrNull()?.second?.let { (it * 100.0).roundToInt() / 100.0 }
                  val skinTrend7d = buildSeries(7, zone) { s, e ->
                      val vals = skinDeltas.filter { it.first in s..e }.map { it.second }
                      if (vals.isEmpty()) 0f else vals.average().toFloat()
                  }

                  val latestSpo2 = latestIcu?.spo2 ?: hcSpo2.maxByOrNull { it.time }?.percentage?.value
                  val latestResp = latestIcu?.respiration ?: hcResp.maxByOrNull { it.time }?.rate

                  // Schlaf & Vergleich
                  val sleepDetail = buildSleep(hcSleep, icuData.wellnessDays, startOfToday, zone)
                  val fitbitLastSleepMin = hcSleep.filter { it.endTime >= startOfToday.minus(Duration.ofHours(16)) }
                      .maxByOrNull { Duration.between(it.startTime, it.endTime).toMinutes() }
                      ?.let { Duration.between(it.startTime, it.endTime).toMinutes() }

                  val comparison = DeviceComparison(
                      garminRhr, fitbitRhr, garminHrv, fitbitHrv,
                      latestIcu?.sleepMinutes, fitbitLastSleepMin, garminTodaySteps, fitbitTodaySteps.takeIf { it > 0L }
                  )

                  val rhrTrend7d = buildSeries(7, zone) { s, e ->
                      val dStr = LocalDate.ofInstant(s.plusSeconds(3600), zone).toString()
                      icuData.wellnessDays.firstOrNull { it.dateIso == dStr }?.restingHr?.toFloat()
                          ?: hcRhr.firstOrNull { it.time in s..e }?.beatsPerMinute?.toFloat()
                  }
                  val hrvTrend7d = buildSeries(7, zone) { s, e ->
                      val dStr = LocalDate.ofInstant(s.plusSeconds(3600), zone).toString()
                      icuData.wellnessDays.firstOrNull { it.dateIso == dStr }?.hrvRmssd?.toFloat()
                          ?: hcHrv.firstOrNull { it.time in s..e }?.heartRateVariabilityMillis?.toFloat()
                  }

                  val recovery = computeRecovery(chosenRhr, chosenHrv, sleepDetail?.performancePercent, todayWorkouts)
                  val strain = computeStrain(todayWorkouts, periodSteps, range == TimeRangeOption.TODAY)
                  val fitnessProfile = FitnessAgeEngine.evaluate(
                      age, chosenRhr, chosenHrv, vo2Max, bodyComp.bodyFatPercent,
                      sleepDetail?.totalMinutes?.let { it / 60.0 }, workouts30d, steps30dAvg
                  )

                  val muscleMap = mutableMapOf<MuscleGroup, Int>().apply { MuscleGroup.values().forEach { put(it, 0) } }
                  for (w in filteredWorkouts) for (mg in w.muscleGroups) muscleMap[mg] = (muscleMap[mg] ?: 0) + 1

                  return HealthReport(
                      LocalDate.now().format(DateTimeFormatter.ofPattern("dd.MM.yyyy")),
                      range, periodSteps, stepsSource, periodKcal,
                      chosenRhr, rhrSource, chosenHrv, hrvSource,
                      latestSkinTemp, latestSpo2, latestResp, vo2Max,
                      rhrTrend7d, hrvTrend7d, skinTrend7d, sleepDetail, bodyComp, comparison,
                      filteredWorkouts, archiveAll.size, muscleMap, logs, recovery, strain, fitnessProfile
                  )
              }
