          class HeartRateChartView(
              context: Context,
              private val curve: List<Int>,
              private val compact: Boolean = false
          ) : View(context) {

              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  color = Color.parseColor("#FF453A")
                  strokeWidth = if (compact) 4f else 6f
                  strokeCap = Paint.Cap.ROUND
                  strokeJoin = Paint.Join.ROUND
              }
              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#212834")
                  strokeWidth = 2f
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#8B949E")
                  textSize = 24f
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = MeasureSpec.getSize(widthMeasureSpec).coerceAtLeast(240)
                  setMeasuredDimension(w, if (compact) 110 else 360)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (curve.size < 2) {
                      if (!compact) canvas.drawText("Keine detaillierte Pulskurve gespeichert", 24f, h / 2f, textPaint)
                      return
                  }

                  val padLeft = if (compact) 8f else 68f
                  val padRight = 16f
                  val padTop = if (compact) 10f else 28f
                  val padBottom = if (compact) 10f else 42f
                  val chartW = (w - padLeft - padRight).coerceAtLeast(10f)
                  val chartH = (h - padTop - padBottom).coerceAtLeast(10f)

                  val minHr = (curve.min() - 8).coerceAtLeast(50)
                  val maxHr = (curve.max() + 8).coerceAtMost(215)
                  val span = (maxHr - minHr).coerceAtLeast(15).toFloat()

                  if (!compact) {
                      for (step in 0..2) {
                          val y = padTop + chartH * (step / 2f)
                          val bpmLabel = (maxHr - (span * (step / 2f))).toInt()
                          canvas.drawLine(padLeft, y, w - padRight, y, gridPaint)
                          canvas.drawText("$bpmLabel", 6f, y + 8f, textPaint)
                      }
                  }

                  val path = Path()
                  val fillPath = Path()
                  curve.forEachIndexed { idx, bpm ->
                      val x = padLeft + chartW * (idx.toFloat() / (curve.size - 1))
                      val normY = ((bpm - minHr) / span).coerceIn(0f, 1f)
                      val y = padTop + chartH * (1f - normY)
                      if (idx == 0) {
                          path.moveTo(x, y)
                          fillPath.moveTo(x, padTop + chartH)
                          fillPath.lineTo(x, y)
                      } else {
                          path.lineTo(x, y)
                          fillPath.lineTo(x, y)
                      }
                  }
                  fillPath.lineTo(padLeft + chartW, padTop + chartH)
                  fillPath.close()

                  fillPaint.shader = LinearGradient(
                      0f, padTop, 0f, padTop + chartH,
                      Color.argb(95, 255, 69, 58), Color.TRANSPARENT, Shader.TileMode.CLAMP
                  )
                  canvas.drawPath(fillPath, fillPaint)
                  canvas.drawPath(path, linePaint)
              }
          }

          class SleepStagesBarView(
              context: Context,
              private val sleep: SleepDetail
          ) : View(context) {

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = MeasureSpec.getSize(widthMeasureSpec).coerceAtLeast(240)
                  setMeasuredDimension(w, 54)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val total = (sleep.deepMinutes + sleep.remMinutes + sleep.lightMinutes + sleep.awakeMinutes).coerceAtLeast(1L).toFloat()

                  val segments = listOf(
                      sleep.deepMinutes to Color.parseColor("#5E5CE6"),
                      sleep.remMinutes to Color.parseColor("#BF5AF2"),
                      sleep.lightMinutes to Color.parseColor("#32D7FF"),
                      sleep.awakeMinutes to Color.parseColor("#FF9F0A")
                  )

                  var curX = 0f
                  for ((mins, col) in segments) {
                      if (mins <= 0L) continue
                      val segW = (mins / total) * w
                      paint.color = col
                      canvas.drawRoundRect(curX, 4f, (curX + segW - 4f).coerceAtLeast(curX + 2f), h - 4f, 14f, 14f, paint)
                      curX += segW
                  }
              }
          }

          class MiniBarChartView(
              context: Context,
              private val data: List<Pair<String, Float>>,
              private val barColor: Int
          ) : View(context) {

              private val barPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = barColor }
              private val txtPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#8B949E")
                  textAlign = Paint.Align.CENTER
                  textSize = 22f
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val w = MeasureSpec.getSize(widthMeasureSpec).coerceAtLeast(240)
                  setMeasuredDimension(w, 210)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (data.isEmpty()) return
                  val w = width.toFloat()
                  val h = height.toFloat()
                  val maxVal = (data.maxOfOrNull { it.second } ?: 1f).coerceAtLeast(1f)
                  val slotW = w / data.size

                  data.forEachIndexed { i, (label, v) ->
                      val cx = slotW * i + slotW / 2f
                      val barW = (slotW * 0.45f).coerceIn(14f, 44f)
                      val barH = ((v / maxVal) * (h - 75f)).coerceAtLeast(if (v > 0f) 12f else 4f)
                      val top = h - 38f - barH
                      barPaint.color = if (v > 0f) barColor else Color.parseColor("#1E2633")
                      canvas.drawRoundRect(cx - barW / 2f, top, cx + barW / 2f, h - 38f, 10f, 10f, barPaint)
                      if (v > 0f) canvas.drawText("${v.toInt()}", cx, top - 8f, txtPaint)
                      canvas.drawText(label, cx, h - 8f, txtPaint)
                  }
              }
          }
