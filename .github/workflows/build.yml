                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/ModelsAndFitnessEngine.kt
          package de.fold8.healthcoach

          import androidx.health.connect.client.records.ExerciseSessionRecord
          import java.time.Instant
          import kotlin.math.roundToInt

          enum class DataSource(val label: String, val cardioPriority: Int) {
              GARMIN("Garmin", 5),
              ZWIFT("Zwift", 4),
              SPEEDIANCE("Speediance", 3),
              WITHINGS("Withings", 2),
              FITBIT("Fitbit Air", 1),
              OTHER("Health Connect", 0)
          }

          enum class TimeRangeOption(val label: String, val days: Long) {
              TODAY("Heute", 1L),
              DAYS_7("7T", 7L),
              DAYS_30("30T", 30L),
              ALL_90("90T", 90L)
          }

          enum class MuscleGroup(val label: String) {
              CHEST("Brust"),
              BACK("Rücken"),
              SHOULDERS("Schultern"),
              LEGS("Beine"),
              ARMS("Arme"),
              CORE("Core")
          }

          data class BodyComposition(
              val weightKg: Double?,
              val bodyFatPercent: Double?,
              val muscleMassKg: Double?,
              val boneMassKg: Double?,
              val waterMassKg: Double?,
              val dateLabel: String?,
              val weightTrend: List<Pair<String, Float>>
          )

          data class DeviceComparison(
              val garminRhr: Int?,
              val fitbitRhr: Int?,
              val garminHrv: Double?,
              val fitbitHrv: Double?,
              val garminSleepMin: Long?,
              val fitbitSleepMin: Long?,
              val garminSteps: Long?,
              val fitbitSteps: Long?
          )

          data class SleepDetail(
              val totalMinutes: Long,
              val deepMinutes: Long,
              val remMinutes: Long,
              val lightMinutes: Long,
              val awakeMinutes: Long,
              val efficiencyPercent: Int,
              val performancePercent: Int,
              val sourceLabel: String,
              val dailyHours7d: List<Pair<String, Float>>
          )

          data class UnifiedWorkout(
              val id: String,
              val dateLabel: String,
              val title: String,
              val startTime: Instant,
              val endTime: Instant,
              val durationMinutes: Long,
              val avgHeartRate: Int?,
              val maxHeartRate: Int?,
              val avgWatts: Int?,
              val normalizedWatts: Int?,
              val distanceKm: Double?,
              val hrCurve: List<Int>,
              val zoneMinutes: List<Int>,
              val activeKcal: Int,
              val strainScore: Double,
              val sourceSummary: String,
              val isStrength: Boolean,
              val isNonStepActivity: Boolean,
              val muscleGroups: Set<MuscleGroup>
          )

          data class FitnessAgeFactor(
              val name: String,
              val valueDisplay: String,
              val deltaYears: Double
          )

          data class FitnessProfile(
              val chronologicalAge: Int,
              val fitnessAge: Int,
              val netDeltaYears: Double,
              val fitnessScore: Int,
              val fitnessLevelLabel: String,
              val factors: List<FitnessAgeFactor>
          )

          data class HealthReport(
              val generatedDateLabel: String,
              val selectedRange: TimeRangeOption,
              val periodSteps: Long,
              val primaryStepsSource: String,
              val periodActiveKcal: Int,
              val latestRestingHr: Int?,
              val restingHrSource: String,
              val latestHrvMs: Double?,
              val hrvSource: String,
              val skinTempDeltaC: Double?,
              val spo2Percent: Double?,
              val respRate: Double?,
              val vo2Max: Double?,
              val rhrTrend7d: List<Pair<String, Float>>,
              val hrvTrend7d: List<Pair<String, Float>>,
              val skinTempTrend7d: List<Pair<String, Float>>,
              val sleepDetail: SleepDetail?,
              val bodyComp: BodyComposition,
              val deviceComparison: DeviceComparison,
              val filteredWorkouts: List<UnifiedWorkout>,
              val archiveCount: Int,
              val periodMuscleSets: Map<MuscleGroup, Int>,
              val auditLogs: List<String>,
              val recoveryPercent: Int,
              val dayStrain: Double,
              val fitnessProfile: FitnessProfile
          )

          object FitnessAgeEngine {

              fun detectMuscles(base: ExerciseSessionRecord?, partner: ExerciseSessionRecord?, manual: Set<String>): Set<MuscleGroup> {
                  if (manual.isNotEmpty()) {
                      return manual.mapNotNull { n -> MuscleGroup.values().firstOrNull { it.name == n } }.toSet()
                  }
                  val found = mutableSetOf<MuscleGroup>()
                  val text = listOfNotNull(base?.title, base?.notes, partner?.title, partner?.notes).joinToString(" ").lowercase()
                  if (listOf("brust", "chest", "push", "bankdrück", "bench").any { text.contains(it) }) found.add(MuscleGroup.CHEST)
                  if (listOf("rücken", "back", "pull", "lat", "ruder", "kreuzheb", "row").any { text.contains(it) }) found.add(MuscleGroup.BACK)
                  if (listOf("schulter", "shoulder", "delts").any { text.contains(it) }) found.add(MuscleGroup.SHOULDERS)
                  if (listOf("bein", "leg", "squat", "kniebeug").any { text.contains(it) }) found.add(MuscleGroup.LEGS)
                  if (listOf("arm", "bizeps", "trizeps", "bicep", "tricep", "curl").any { text.contains(it) }) found.add(MuscleGroup.ARMS)
                  if (listOf("core", "bauch", "abs", "plank").any { text.contains(it) }) found.add(MuscleGroup.CORE)
                  if (text.contains("oberkörper") || text.contains("upper")) found.addAll(listOf(MuscleGroup.CHEST, MuscleGroup.BACK, MuscleGroup.SHOULDERS, MuscleGroup.ARMS))
                  if (text.contains("unterkörper") || text.contains("lower")) found.addAll(listOf(MuscleGroup.LEGS, MuscleGroup.CORE))
                  if (text.contains("ganzkörper") || text.contains("full body")) found.addAll(MuscleGroup.values().toList())
                  return found
              }

              fun evaluate(
                  age: Int,
                  rhr: Int?,
                  hrvMs: Double?,
                  vo2Max: Double?,
                  bodyFatPct: Double?,
                  sleepHours: Double?,
                  workouts30d: List<UnifiedWorkout>,
                  avgSteps30d: Long
              ): FitnessProfile {
                  val factors = mutableListOf<FitnessAgeFactor>()

                  // 1. Kardiovaskulärer Ruhepuls (NTNU/HUNT-Modell: Referenz ~61 bpm)
                  val rhrDelta = if (rhr != null && rhr in 38..120) {
                      ((rhr - 61) * 0.30).coerceIn(-4.2, 7.0)
                  } else 0.0
                  factors.add(FitnessAgeFactor("Ruhepuls", rhr?.let { "$it bpm" } ?: "nicht erfasst", round1(rhrDelta)))

                  // 2. Autonome Erholung via HRV RMSSD (Altersnorm: 66 - 0.52 * Alter)
                  val refHrv = (66.0 - age * 0.52).coerceIn(28.0, 62.0)
                  val hrvDelta = if (hrvMs != null && hrvMs in 8.0..180.0) {
                      ((refHrv - hrvMs) * 0.13).coerceIn(-4.5, 6.0)
                  } else 0.0
                  factors.add(FitnessAgeFactor("HRV (Norm ${refHrv.roundToInt()} ms)", hrvMs?.let { "${it.roundToInt()} ms" } ?: "nicht erfasst", round1(hrvDelta)))

                  // 3. Aerobe Fitness (VO2max + Ausdauervolumen)
                  val weeks = 30.0 / 7.0
                  val weeklyCardioMin = (workouts30d.filter { !it.isStrength }.sumOf { it.durationMinutes } / weeks).roundToInt()
                  val cardioDelta = if (vo2Max != null && vo2Max in 20.0..85.0) {
                      val refVo2 = (55.0 - age * 0.34).coerceAtLeast(32.0)
                      ((refVo2 - vo2Max) * 0.45).coerceIn(-5.0, 5.5)
                  } else {
                      when {
                          weeklyCardioMin >= 180 -> -2.2
                          weeklyCardioMin >= 100 -> -1.0
                          weeklyCardioMin >= 45 -> 0.2
                          else -> 1.8
                      }
                  }
                  val cardioLabel = vo2Max?.let { "VO2max ${"%.1f".format(it)}" } ?: "$weeklyCardioMin Min/Wo"
                  factors.add(FitnessAgeFactor("Ausdauer & VO2max", cardioLabel, round1(cardioDelta)))

                  // 4. Körperzusammensetzung (Withings Körperfett) & Krafttraining (Speediance)
                  val weeklyStrength = workouts30d.count { it.isStrength } / weeks
                  var bodyStrengthDelta = when {
                      weeklyStrength >= 2.5 -> -1.4
                      weeklyStrength >= 1.2 -> -0.6
                      else -> 0.6
                  }
                  if (bodyFatPct != null && bodyFatPct in 5.0..55.0) {
                      bodyStrengthDelta += ((bodyFatPct - 18.0) * 0.22).coerceIn(-1.8, 3.5)
                  }
                  val bsLabel = buildString {
                      append("${"%.1f".format(weeklyStrength)}× Kraft/Wo")
                      if (bodyFatPct != null) append(" • ${"%.1f".format(bodyFatPct)}% Fett")
                  }
                  factors.add(FitnessAgeFactor("Kraft & Körperbau", bsLabel, round1(bodyStrengthDelta)))

                  // 5. Schlaf & Basis-Bewegung
                  var habitDelta = when {
                      avgSteps30d >= 9000L -> -0.9
                      avgSteps30d >= 6500L -> -0.2
                      else -> 1.1
                  }
                  if (sleepHours != null) {
                      habitDelta += when {
                          sleepHours >= 7.4 -> -0.7
                          sleepHours >= 6.4 -> 0.0
                          else -> 1.1
                      }
                  }
                  factors.add(FitnessAgeFactor("Schlaf & Schritte", "Ø $avgSteps30d/Tag", round1(habitDelta)))

                  val netDelta = round1(factors.sumOf { it.deltaYears }.coerceIn(-11.0, 15.0))
                  val fitnessAge = (age + netDelta.roundToInt()).coerceAtLeast(18)
                  val score = (62.0 - netDelta * 4.2).roundToInt().coerceIn(15, 99)

                  val level = when {
                      score >= 88 -> "Elite"
                      score >= 74 -> "Athlet"
                      score >= 58 -> "Fortgeschritten"
                      score >= 42 -> "Aktiv"
                      else -> "Aufbauphase"
                  }

                  return FitnessProfile(age, fitnessAge, netDelta, score, level, factors)
              }

              private fun round1(v: Double): Double = (v * 10.0).roundToInt() / 10.0
          }
          EOF

                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/IntervalsClient.kt
          package de.fold8.healthcoach

          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.time.Instant
          import java.time.LocalDate
          import java.time.LocalDateTime
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import kotlin.math.ln
          import kotlin.math.roundToInt

          data class IntervalsWellnessDay(
              val dateIso: String,
              val restingHr: Int?,
              val hrvRmssd: Double?,
              val sleepMinutes: Long?,
              val steps: Long?,
              val vo2Max: Double?,
              val weightKg: Double?,
              val spo2: Double?,
              val respiration: Double?
          )

          data class IntervalsSyncResult(
              val wellnessDays: List<IntervalsWellnessDay>,
              val workouts: List<UnifiedWorkout>,
              val statusNote: String
          )

          class IntervalsClient {

              suspend fun fetchGarminAndZwift(apiKey: String, daysBack: Long, userAge: Int): IntervalsSyncResult =
                  withContext(Dispatchers.IO) {
                      val cleanKey = apiKey.trim()
                      if (cleanKey.isBlank()) {
                          return@withContext IntervalsSyncResult(emptyList(), emptyList(), "Intervals.icu nicht verknüpft")
                      }

                      val newest = LocalDate.now().toString()
                      val oldest = LocalDate.now().minusDays(daysBack).toString()
                      val authHeader = "Basic " + Base64.encodeToString("API_KEY:$cleanKey".toByteArray(Charsets.UTF_8), Base64.NO_WRAP)

                      try {
                          val wellnessJson = httpGet("https://intervals.icu/api/v1/athlete/0/wellness?oldest=$oldest&newest=$newest", authHeader)
                          val activitiesJson = httpGet("https://intervals.icu/api/v1/athlete/0/activities?oldest=$oldest&newest=$newest", authHeader)

                          val wellnessList = parseWellness(wellnessJson)
                          val workoutList = parseActivities(activitiesJson, userAge)

                          IntervalsSyncResult(
                              wellnessList,
                              workoutList,
                              "Intervals.icu aktiv: ${wellnessList.size} Wellness-Tage, ${workoutList.size} Garmin/Zwift-Trainings"
                          )
                      } catch (e: Exception) {
                          IntervalsSyncResult(emptyList(), emptyList(), "Intervals.icu Fehler: ${e.message}")
                      }
                  }

              private fun httpGet(urlStr: String, authHeader: String): String {
                  val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                      requestMethod = "GET"
                      setRequestProperty("Authorization", authHeader)
                      setRequestProperty("Accept", "application/json")
                      connectTimeout = 15000
                      readTimeout = 20000
                  }
                  val code = conn.responseCode
                  if (code !in 200..299) {
                      throw RuntimeException("HTTP $code (API-Key prüfen)")
                  }
                  return conn.inputStream.bufferedReader().use { it.readText() }
              }

              private fun parseWellness(raw: String): List<IntervalsWellnessDay> {
                  val arr = JSONArray(raw)
                  val out = mutableListOf<IntervalsWellnessDay>()
                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val id = o.optString("id", "")
                      if (id.isBlank()) continue
                      val rhr = if (!o.isNull("restingHR")) o.optInt("restingHR").takeIf { it in 35..125 } else null
                      val hrv = when {
                          !o.isNull("hrv") -> o.optDouble("hrv").takeIf { it in 8.0..180.0 }
                          !o.isNull("hrvSDNN") -> o.optDouble("hrvSDNN").takeIf { it in 8.0..220.0 }
                          else -> null
                      }
                      val sleepMin = if (!o.isNull("sleepSecs")) (o.optLong("sleepSecs") / 60L).takeIf { it > 30L } else null
                      val steps = if (!o.isNull("steps")) o.optLong("steps").takeIf { it > 0L } else null
                      val vo2 = if (!o.isNull("vo2max")) o.optDouble("vo2max").takeIf { it in 20.0..85.0 } else null
                      val weight = if (!o.isNull("weight")) o.optDouble("weight").takeIf { it in 35.0..220.0 } else null
                      val spo2 = if (!o.isNull("spO2")) o.optDouble("spO2").takeIf { it in 80.0..100.0 } else null
                      val resp = if (!o.isNull("respiration")) o.optDouble("respiration").takeIf { it in 6.0..40.0 } else null

                      out.add(IntervalsWellnessDay(id, rhr, hrv, sleepMin, steps, vo2, weight, spo2, resp))
                  }
                  return out
              }

              private fun parseActivities(raw: String, userAge: Int): List<UnifiedWorkout> {
                  val arr = JSONArray(raw)
                  val out = mutableListOf<UnifiedWorkout>()
                  val zone = ZoneId.systemDefault()
                  val dateFmt = DateTimeFormatter.ofPattern("dd.MM.").withZone(zone)
                  val estMaxHr = (211 - 0.64 * userAge).roundToInt().coerceIn(160, 205)

                  for (i in 0 until arr.length()) {
                      val o = arr.getJSONObject(i)
                      val startStr = o.optString("start_date_local", "")
                      if (startStr.length < 19) continue
                      val startInstant = try {
                          LocalDateTime.parse(startStr.substring(0, 19)).atZone(zone).toInstant()
                      } catch (_: Exception) { continue }

                      val movingSec = o.optLong("moving_time", o.optLong("elapsed_time", 1800L)).coerceAtLeast(60L)
                      val durMin = (movingSec / 60L).coerceAtLeast(1L)
                      val endInstant = startInstant.plusSeconds(movingSec)

                      val rawSrc = o.optString("source", "").uppercase()
                      val name = o.optString("name", "").ifBlank { o.optString("type", "Training") }
                      val type = o.optString("type", "")
                      val isZwift = rawSrc.contains("ZWIFT") || name.lowercase().let { n ->
                          listOf("zwift", "watopia", "makuri", "innsbruck", "richmond", "yorkshire").any { n.contains(it) }
                      }
                      val srcLabel = if (isZwift) "Zwift (via Intervals)" else "Garmin (via Intervals)"
                      val isStrength = type.contains("Weight", true) || type.contains("Strength", true)

                      val avgHr = if (!o.isNull("average_heartrate")) o.optDouble("average_heartrate").roundToInt().takeIf { it in 45..220 } else null
                      val maxHr = if (!o.isNull("max_heartrate")) o.optDouble("max_heartrate").roundToInt().takeIf { it in 55..230 } else null
                      val avgW = if (!o.isNull("average_watts")) o.optDouble("average_watts").roundToInt().takeIf { it > 0 } else null
                      val npW = if (!o.isNull("weighted_average_watts")) o.optDouble("weighted_average_watts").roundToInt().takeIf { it > 0 } else null
                      val distKm = if (!o.isNull("distance")) ((o.optDouble("distance") / 100.0).roundToInt() / 10.0).takeIf { it > 0.0 } else null
                      val kcal = if (!o.isNull("calories")) o.optInt("calories").takeIf { it in 10..3500 } ?: (durMin * 7).toInt() else (durMin * 7).toInt()

                      val load = if (!o.isNull("icu_training_load") && o.optDouble("icu_training_load") > 0.0) {
                          ((o.optDouble("icu_training_load") / 8.5).coerceIn(1.5, 20.8) * 10.0).roundToInt() / 10.0
                      } else {
                          val hrRatio = ((avgHr ?: 120).toDouble() / estMaxHr).coerceIn(0.45, 1.0)
                          ((ln(1.0 + durMin * hrRatio * 0.45) * 3.8).coerceIn(1.5, 20.5) * 10.0).roundToInt() / 10.0
                      }

                      val isNonStep = isStrength || isZwift || type.contains("Ride", true) || type.contains("Cycling", true) || type.contains("Row", true)

                      out.add(
                          UnifiedWorkout(
                              id = "icu_${o.optString("id", "${startInstant.epochSecond}")}",
                              dateLabel = dateFmt.format(startInstant),
                              title = name,
                              startTime = startInstant,
                              endTime = endInstant,
                              durationMinutes = durMin,
                              avgHeartRate = avgHr,
                              maxHeartRate = maxHr,
                              avgWatts = avgW,
                              normalizedWatts = npW,
                              distanceKm = distKm,
                              hrCurve = emptyList(),
                              zoneMinutes = emptyList(),
                              activeKcal = kcal,
                              strainScore = load,
                              sourceSummary = srcLabel,
                              isStrength = isStrength,
                              isNonStepActivity = isNonStep,
                              muscleGroups = emptySet()
                          )
                      )
                  }
                  return out
              }
          }
