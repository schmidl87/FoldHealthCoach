                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/HealthModelsAndAnalyzer.kt
          package de.fold8.healthcoach

          import androidx.health.connect.client.records.ExerciseSessionRecord
          import java.time.Instant
          import kotlin.math.roundToInt

          enum class DataSource(val label: String, val cardioPriority: Int) {
              GARMIN("Garmin", 4),
              ZWIFT("Zwift", 3),
              SPEEDIANCE("Speediance", 2),
              GOOGLE_SAMSUNG("Google / Samsung", 1),
              OTHER("Andere App", 0)
          }

          enum class TimeRangeOption(val label: String, val days: Long) {
              TODAY("Heute", 1L),
              DAYS_7("7T", 7L),
              DAYS_30("30T", 30L),
              ALL_90("90T", 90L)
          }

          enum class MuscleGroup(val label: String) {
              CHEST("Brust"),
              BACK("Rücken"),
              SHOULDERS("Schultern"),
              LEGS("Beine"),
              ARMS("Arme"),
              CORE("Core")
          }

          data class SleepDetail(
              val totalMinutes: Long,
              val deepMinutes: Long,
              val remMinutes: Long,
              val lightMinutes: Long,
              val awakeMinutes: Long,
              val efficiencyPercent: Int,
              val sleepPerformancePercent: Int,
              val sourceLabel: String,
              val dailyHours7d: List<Pair<String, Float>>
          )

          data class UnifiedWorkout(
              val id: String,
              val dateLabel: String,
              val title: String,
              val startTime: Instant,
              val endTime: Instant,
              val durationMinutes: Long,
              val avgHeartRate: Int?,
              val maxHeartRate: Int?,
              val hrCurve: List<Int>,
              val zoneMinutes: List<Int>,
              val activeKcal: Int,
              val strainScore: Double,
              val sourceSummary: String,
              val isStrength: Boolean,
              val isNonStepActivity: Boolean,
              val muscleGroups: Set<MuscleGroup>
          )

          data class FitnessProfile(
              val chronologicalAge: Int,
              val fitnessAge: Int,
              val ageDelta: Int,
              val fitnessScore: Int,
              val fitnessLevelLabel: String,
              val vo2Max: Double?,
              val latestRestingHr: Int?,
              val latestHrvMs: Double?,
              val factorBreakdown: List<String>
          )

          data class HealthReport(
              val generatedDateLabel: String,
              val selectedRange: TimeRangeOption,
              val periodSteps: Long,
              val periodRawSteps: Long,
              val periodActiveKcal: Int,
              val latestRestingHr: Int?,
              val latestHrvMs: Double?,
              val rhrTrend7d: List<Pair<String, Float>>,
              val hrvTrend7d: List<Pair<String, Float>>,
              val sleepDetail: SleepDetail?,
              val filteredWorkouts: List<UnifiedWorkout>,
              val allHistoricalWorkoutsCount: Int,
              val periodMuscleSets: Map<MuscleGroup, Int>,
              val auditLogs: List<String>,
              val recoveryPercent: Int,
              val dayStrain: Double,
              val fitnessProfile: FitnessProfile
          )

          object MuscleAndFitnessAnalyzer {

              fun detectMuscleGroups(base: ExerciseSessionRecord, partner: ExerciseSessionRecord?, manualNames: Set<String>): Set<MuscleGroup> {
                  if (manualNames.isNotEmpty()) {
                      return manualNames.mapNotNull { n -> MuscleGroup.values().firstOrNull { it.name == n } }.toSet()
                  }
                  val found = mutableSetOf<MuscleGroup>()
                  val text = listOfNotNull(base.title, base.notes, partner?.title, partner?.notes).joinToString(" ").lowercase()
                  if (listOf("brust", "chest", "push", "bankdrück", "bench").any { text.contains(it) }) found.add(MuscleGroup.CHEST)
                  if (listOf("rücken", "back", "pull", "lat", "ruder", "kreuzheb", "row").any { text.contains(it) }) found.add(MuscleGroup.BACK)
                  if (listOf("schulter", "shoulder", "delts").any { text.contains(it) }) found.add(MuscleGroup.SHOULDERS)
                  if (listOf("bein", "leg", "squat", "kniebeug").any { text.contains(it) }) found.add(MuscleGroup.LEGS)
                  if (listOf("arm", "bizeps", "trizeps", "bicep", "tricep", "curl").any { text.contains(it) }) found.add(MuscleGroup.ARMS)
                  if (listOf("core", "bauch", "abs", "plank").any { text.contains(it) }) found.add(MuscleGroup.CORE)
                  if (text.contains("oberkörper") || text.contains("upper")) found.addAll(listOf(MuscleGroup.CHEST, MuscleGroup.BACK, MuscleGroup.SHOULDERS, MuscleGroup.ARMS))
                  if (text.contains("unterkörper") || text.contains("lower")) found.addAll(listOf(MuscleGroup.LEGS, MuscleGroup.CORE))
                  if (text.contains("ganzkörper") || text.contains("full body")) found.addAll(MuscleGroup.values().toList())
                  return found
              }

              fun calculateFitnessProfile(
                  age: Int,
                  vo2Max: Double?,
                  rhr: Int?,
                  hrvMs: Double?,
                  avgSleepHours: Double?,
                  workouts30d: List<UnifiedWorkout>,
                  avgDailySteps30d: Long
              ): FitnessProfile {
                  val factors = mutableListOf<String>()
                  var ageDelta = 0.0
                  var score = 55.0

                  // 1. Ruhepuls-Einfluss (Norm ca. 62 bpm; höherer Puls erhöht das Fitnessalter ehrlich!)
                  if (rhr != null && rhr in 38..120) {
                      val rhrAdj = ((rhr - 62) * 0.28).coerceIn(-4.5, 6.5)
                      ageDelta += rhrAdj
                      score -= rhrAdj * 4.5
                      val sign = if (rhrAdj > 0) "+" else ""
                      factors.add("Ruhepuls ($rhr bpm): $sign${"%.1f".format(rhrAdj)} J.")
                  } else {
                      factors.add("Ruhepuls: Keine aktuellen Daten")
                  }

                  // 2. HRV RMSSD-Einfluss (Norm für ~39 J. ca. 45 ms; niedrige HRV = mehr Stress / höheres Fitnessalter)
                  if (hrvMs != null && hrvMs in 8.0..180.0) {
                      val expectedHrv = (65.0 - age * 0.5).coerceIn(28.0, 62.0)
                      val hrvAdj = ((expectedHrv - hrvMs) / 10.0 * 1.15).coerceIn(-4.5, 5.5)
                      ageDelta += hrvAdj
                      score -= hrvAdj * 4.5
                      val sign = if (hrvAdj > 0) "+" else ""
                      factors.add("HRV (${hrvMs.roundToInt()} ms vs. Norm ${expectedHrv.roundToInt()} ms): $sign${"%.1f".format(hrvAdj)} J.")
                  } else {
                      factors.add("HRV: Noch nicht in Health Connect erfasst")
                  }

                  // 3. VO2max (falls Garmin überträgt)
                  if (vo2Max != null && vo2Max in 20.0..85.0) {
                      val expectedVo2 = (56.0 - age * 0.34).coerceAtLeast(32.0)
                      val vo2Adj = ((expectedVo2 - vo2Max) * 0.45).coerceIn(-5.0, 5.5)
                      ageDelta += vo2Adj
                      score -= vo2Adj * 5.0
                      val sign = if (vo2Adj > 0) "+" else ""
                      factors.add("VO2max (${"%.1f".format(vo2Max)}): $sign${"%.1f".format(vo2Adj)} J.")
                  }

                  // 4. Ausdauer & Kraft (30-Tage-Schnitt)
                  val weeks = 30.0 / 7.0
                  val weeklyCardio = workouts30d.filter { !it.isStrength }.sumOf { it.durationMinutes } / weeks
                  val weeklyStrength = workouts30d.count { it.isStrength } / weeks
                  val trainAdj = when {
                      weeklyCardio >= 150 && weeklyStrength >= 2.0 -> -2.2
                      weeklyCardio >= 90 || weeklyStrength >= 2.0 -> -1.0
                      weeklyCardio < 30 && weeklyStrength < 1.0 -> 2.0
                      else -> 0.3
                  }
                  ageDelta += trainAdj
                  score -= trainAdj * 5.0
                  val tSign = if (trainAdj > 0) "+" else ""
                  factors.add("Training (${weeklyCardio.roundToInt()} Min. Cardio, ${"%.1f".format(weeklyStrength)}× Kraft/Wo): $tSign${"%.1f".format(trainAdj)} J.")

                  // 5. Schlaf & Alltagsschritte
                  var lifestyleAdj = 0.0
                  if (avgSleepHours != null) {
                      lifestyleAdj += if (avgSleepHours < 6.3) 1.0 else if (avgSleepHours >= 7.5) -0.7 else 0.0
                  }
                  lifestyleAdj += if (avgDailySteps30d < 5000L) 1.0 else if (avgDailySteps30d >= 8500L) -0.8 else 0.0
                  ageDelta += lifestyleAdj
                  score -= lifestyleAdj * 4.0
                  val lSign = if (lifestyleAdj > 0) "+" else ""
                  factors.add("Schlaf & Schritte (Ø $avgDailySteps30d/Tag): $lSign${"%.1f".format(lifestyleAdj)} J.")

                  val finalAdj = ageDelta.roundToInt().coerceIn(-10, 14)
                  val fitnessAge = (age + finalAdj).coerceAtLeast(18)
                  val finalScore = score.roundToInt().coerceIn(15, 99)

                  val level = when {
                      finalScore >= 88 -> "Elite"
                      finalScore >= 74 -> "Athlet"
                      finalScore >= 58 -> "Fortgeschritten"
                      finalScore >= 42 -> "Aktiv"
                      else -> "Aufbauphase"
                  }

                  return FitnessProfile(age, fitnessAge, finalAdj, finalScore, level, vo2Max, rhr, hrvMs, factors)
              }
          }
          EOF

                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/HealthFusionEngine.kt
          package de.fold8.healthcoach

          import android.content.Context
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.*
          import androidx.health.connect.client.request.ReadRecordsRequest
          import androidx.health.connect.client.time.TimeRangeFilter
          import org.json.JSONArray
          import org.json.JSONObject
          import java.time.Duration
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import kotlin.math.ln
          import kotlin.math.min
          import kotlin.math.roundToInt

          class HealthFusionEngine(private val context: Context) {

              companion object {
                  const val PERMISSION_HISTORY = "android.permission.health.READ_HEALTH_DATA_HISTORY"

                  val REQUIRED_PERMISSIONS = setOf(
                      HealthPermission.getReadPermission(StepsRecord::class),
                      HealthPermission.getReadPermission(ExerciseSessionRecord::class),
                      HealthPermission.getReadPermission(HeartRateRecord::class),
                      HealthPermission.getReadPermission(RestingHeartRateRecord::class),
                      HealthPermission.getReadPermission(HeartRateVariabilityRmssdRecord::class),
                      HealthPermission.getReadPermission(SleepSessionRecord::class),
                      HealthPermission.getReadPermission(ActiveCaloriesBurnedRecord::class),
                      HealthPermission.getReadPermission(Vo2MaxRecord::class),
                      PERMISSION_HISTORY
                  )
              }

              private suspend inline fun <reified T : Record> readAllRecords(
                  client: HealthConnectClient,
                  start: Instant,
                  end: Instant
              ): List<T> {
                  val all = mutableListOf<T>()
                  var token: String? = null
                  do {
                      val resp = client.readRecords(
                          ReadRecordsRequest(T::class, TimeRangeFilter.between(start, end), pageToken = token)
                      )
                      all.addAll(resp.records)
                      token = resp.pageToken
                  } while (token != null)
                  return all
              }

              private fun classifySource(packageName: String, titleOrNotes: String = ""): DataSource {
                  val pkg = packageName.lowercase()
                  val text = titleOrNotes.lowercase()
                  return when {
                      pkg.contains("zwift") || listOf("zwift", "watopia", "makuri", "innsbruck", "richmond", "yorkshire").any { text.contains(it) } -> DataSource.ZWIFT
                      pkg.contains("garmin") -> DataSource.GARMIN
                      pkg.contains("speediance") -> DataSource.SPEEDIANCE
                      pkg.contains("google") || pkg.contains("healthdata") || pkg.contains("fit") || pkg.contains("shealth") || pkg.contains("samsung") -> DataSource.GOOGLE_SAMSUNG
                      else -> DataSource.OTHER
                  }
              }

              suspend fun buildReport(chronologicalAge: Int, range: TimeRangeOption): HealthReport {
                  val client = HealthConnectClient.getOrCreate(context)
                  val prefs = context.getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  val zone = ZoneId.systemDefault()
                  val now = Instant.now()
                  val startOfToday = LocalDate.now().atStartOfDay(zone).toInstant()
                  val historyStart = startOfToday.minus(Duration.ofDays(89))
                  val filterStart = if (range == TimeRangeOption.TODAY) startOfToday else startOfToday.minus(Duration.ofDays(range.days - 1))
                  val logs = mutableListOf<String>()

                  val rawWorkouts90d = readAllRecords<ExerciseSessionRecord>(client, historyStart, now)
                  val rawHr90d = readAllRecords<HeartRateRecord>(client, historyStart, now)
                  val rawCalories90d = readAllRecords<ActiveCaloriesBurnedRecord>(client, historyStart, now)
                  val rawSteps90d = readAllRecords<StepsRecord>(client, historyStart, now)
                  val rawRestingHr30d = readAllRecords<RestingHeartRateRecord>(client, startOfToday.minus(Duration.ofDays(30)), now)
                  val rawHrv30d = try { readAllRecords<HeartRateVariabilityRmssdRecord>(client, startOfToday.minus(Duration.ofDays(30)), now) } catch (_: Exception) { emptyList() }
                  val rawSleep14d = readAllRecords<SleepSessionRecord>(client, startOfToday.minus(Duration.ofDays(14)), now)
                  val vo2Max = try {
                      readAllRecords<Vo2MaxRecord>(client, historyStart, now)
                          .sortedWith(compareByDescending<Vo2MaxRecord> { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }.thenByDescending { it.time })
                          .firstOrNull()?.vo2MillilitersPerMinuteKilogram
                  } catch (_: Exception) { null }

                  val liveMerged90d = mergeWorkouts(rawWorkouts90d, rawHr90d, rawCalories90d, prefs, logs, filterStart, chronologicalAge)
                  val archivedMerged = saveAndMergeLocalArchive(prefs, liveMerged90d)

                  val filteredWorkouts = archivedMerged.filter { it.endTime >= filterStart }
                  val workouts30d = archivedMerged.filter { it.endTime >= startOfToday.minus(Duration.ofDays(30)) }
                  val todayWorkouts = archivedMerged.filter { it.endTime >= startOfToday }

                  val periodStepsRaw = rawSteps90d.filter { it.endTime >= filterStart }
                  val periodCleanSteps = filterAndDeduplicateSteps(periodStepsRaw, filteredWorkouts, logs, recordLogs = true)
                  val steps30dClean = filterAndDeduplicateSteps(rawSteps90d.filter { it.endTime >= startOfToday.minus(Duration.ofDays(30)) }, workouts30d, mutableListOf(), recordLogs = false)
                  val periodCleanKcal = deduplicateCalories(rawCalories90d.filter { it.endTime >= filterStart }, filteredWorkouts, logs)

                  // Aktuellster echter Ruhepuls (Garmin bevorzugt, nach Zeit sortiert + Fallback auf Nacht-HR)
                  val validResting = rawRestingHr30d.filter { it.beatsPerMinute in 40..125 }
                      .sortedWith(compareByDescending<RestingHeartRateRecord> { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }.thenByDescending { it.time })
                  val latestRestingHr = validResting.firstOrNull()?.beatsPerMinute?.toInt()
                      ?: estimateOvernightRestingHr(rawHr90d, startOfToday.minus(Duration.ofHours(14)), now)

                  // Aktuellste HRV (RMSSD)
                  val validHrv = rawHrv30d.filter { it.heartRateVariabilityMillis in 8.0..180.0 }
                      .sortedWith(compareByDescending<HeartRateVariabilityRmssdRecord> { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }.thenByDescending { it.time })
                  val latestHrvMs = validHrv.firstOrNull()?.heartRateVariabilityMillis

                  val rhrTrend7d = buildDailySeries(7, zone) { dStart, dEnd ->
                      validResting.firstOrNull { it.time in dStart..dEnd }?.beatsPerMinute?.toFloat()
                  }
                  val hrvTrend7d = buildDailySeries(7, zone) { dStart, dEnd ->
                      validHrv.firstOrNull { it.time in dStart..dEnd }?.heartRateVariabilityMillis?.toFloat()
                  }

                  val sleepDetail = buildSleepDetail(rawSleep14d, startOfToday, zone, logs)
                  val recoveryPercent = calculateWhoopRecovery(latestRestingHr, latestHrvMs, sleepDetail?.sleepPerformancePercent, todayWorkouts)
                  val dayStrain = calculateDayStrain(todayWorkouts, periodCleanSteps, range == TimeRangeOption.TODAY)

                  val fitnessProfile = MuscleAndFitnessAnalyzer.calculateFitnessProfile(
                      chronologicalAge, vo2Max, latestRestingHr, latestHrvMs,
                      sleepDetail?.totalMinutes?.let { it / 60.0 }, workouts30d, steps30dClean / 30L
                  )

                  val muscleSets = mutableMapOf<MuscleGroup, Int>().apply { MuscleGroup.values().forEach { put(it, 0) } }
                  for (w in filteredWorkouts) for (mg in w.muscleGroups) muscleSets[mg] = (muscleSets[mg] ?: 0) + 1
                  if (logs.isEmpty()) logs.add("Garmin-, Zwift- & Speediance-Regeln aktiv: Alle Daten im Zeitraum (${range.label}) plausibel.")

                  return HealthReport(
                      LocalDate.now().format(DateTimeFormatter.ofPattern("dd.MM.yyyy")),
                      range, periodCleanSteps, periodStepsRaw.sumOf { it.count }, periodCleanKcal,
