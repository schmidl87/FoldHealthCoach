              private fun buildNavigationBar(isInner: Boolean): LinearLayout {
                  tabButtons.clear()
                  val labels = listOf("◉ Übersicht", "☾ Schlaf", "⚡ Fitness", "♥ Gesundheit")
                  return LinearLayout(this).apply {
                      orientation = if (isInner) LinearLayout.VERTICAL else LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#0F141C"))
                      setPadding(12, if (isInner) 64 else 14, 12, 18)
                      layoutParams = if (isInner) LinearLayout.LayoutParams(230, ViewGroup.LayoutParams.MATCH_PARENT)
                      else LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)

                      labels.forEachIndexed { idx, lbl ->
                          val tv = TextView(this@MainActivity).apply {
                              text = lbl
                              textSize = 13f
                              gravity = if (isInner) Gravity.START else Gravity.CENTER
                              setPadding(24, 22, 24, 22)
                              layoutParams = if (isInner) LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 12) }
                              else LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                              setOnClickListener { activeTab = idx; updateTabHighlight(); renderActiveTab() }
                          }
                          tabButtons.add(tv)
                          addView(tv)
                      }
                      updateTabHighlight()
                  }
