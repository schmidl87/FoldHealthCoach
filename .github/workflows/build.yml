              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = CardGlass,
                  title = { Text("${workout.title} (${workout.dateLabel})", color = Color.White, fontWeight = FontWeight.Bold) },
                  text = {
                      Column {
                          Text("♥ Ø ${workout.avgHeartRate ?: "-"} / Max ${workout.maxHeartRate ?: "-"} bpm • ${workout.activeKcal} kcal", color = Color(0xFFC9D1D9), fontSize = 13.sp)
                          if (workout.hrCurve.size >= 2) {
                              Spacer(Modifier.height(10.dp))
                              SmoothAreaChart(workout.hrCurve.map { it.toFloat() }, HealthCoral, Modifier.fillMaxWidth().height(110.dp))
                          }
                          if (workout.zoneMinutes.size == 5) {
                              Spacer(Modifier.height(8.dp))
                              Text("Pulszonen: Z1 ${workout.zoneMinutes[0]}m • Z2 ${workout.zoneMinutes[1]}m • Z3 ${workout.zoneMinutes[2]}m • Z4 ${workout.zoneMinutes[3]}m • Z5 ${workout.zoneMinutes[4]}m", color = MutedGray, fontSize = 11.5.sp)
                          }
                          Spacer(Modifier.height(12.dp))
                          Text("Speediance Muskelgruppen zuweisen:", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(6.dp))
                          MuscleGroup.values().toList().chunked(3).forEach { rowGroups ->
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp), modifier = Modifier.padding(vertical = 3.dp)) {
                                  rowGroups.forEach { mg ->
                                      val active = selected.contains(mg)
                                      FilterChip(
                                          selected = active,
                                          onClick = { selected = if (active) selected - mg else selected + mg },
                                          label = { Text(mg.label, fontSize = 11.sp) }
