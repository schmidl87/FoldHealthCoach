              private fun saveSettings(prefs: android.content.SharedPreferences) {
                  val parsedAge = ageInput.text.toString().toIntOrNull()?.coerceIn(16, 99) ?: 39
                  prefs.edit().putInt("user_age", parsedAge).putString("gemini_api_key", apiKeyInput.text.toString()).apply()
              }

              private fun checkInitialStatus() {
                  if (HealthConnectClient.getSdkStatus(this) != HealthConnectClient.SDK_AVAILABLE) { statusView.text = "Health Connect nicht verfügbar."; return }
                  lifecycleScope.launch {
                      val granted = HealthConnectClient.getOrCreate(this@MainActivity).permissionController.getGrantedPermissions()
                      if (granted.size >= 4) { statusView.text = "Verbunden • Garmin, Zwift & Speediance aktiv"; refreshHealthData() }
                      else statusView.text = "Bitte oben auf 'Rechte' tippen."
                  }
              }

              private fun checkAndRequestPermissions() {
                  if (HealthConnectClient.getSdkStatus(this) == HealthConnectClient.SDK_AVAILABLE) requestPermissionsLauncher.launch(HealthFusionEngine.REQUIRED_PERMISSIONS)
              }

              private fun refreshHealthData() {
                  val prefs = getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  val userAge = prefs.getInt("user_age", 39)
                  statusView.text = "Lade Historie (${selectedRange.label}) & berechne Fitnessalter..."

                  lifecycleScope.launch {
                      try {
                          val report = fusionEngine.buildReport(userAge, selectedRange)
                          val fp = report.fitnessProfile
                          statusView.text = "${selectedRange.label} • Archiv: ${report.allHistoricalWorkoutsCount} Trainings • Erholung ${report.recoveryScore}/100"

                          val deltaText = when {
                              fp.ageDelta < 0 -> "${-fp.ageDelta} Jahre jünger als ${fp.chronologicalAge}"
                              fp.ageDelta > 0 -> "${fp.ageDelta} Jahre über ${fp.chronologicalAge}"
                              else -> "entspricht deinem Alter (${fp.chronologicalAge})"
                          }
                          fitnessHeroView.text = "Fitnessalter: ${fp.fitnessAge} Jahre ($deltaText)\nFitnesslevel: ${fp.fitnessLevelLabel} (${fp.fitnessScore} / 100 Punkte)\n${fp.explanation}"
                          metricsView.text = "• Schritte (${selectedRange.label}): ${report.periodSteps} (Roh: ${report.periodRawSteps})\n• Aktivkalorien (${selectedRange.label}): ${report.periodActiveKcal} kcal\n• Ruhepuls: ${report.latestRestingHr?.let { "$it bpm" } ?: "-"} | Schlaf: ${report.latestSleepHours?.let { "$it Std." } ?: "-"}\n• Erholungs-Index heute: ${report.recoveryScore} / 100"

                          renderMuscleGroups(report.periodMuscleSets)
                          renderWorkouts(report.filteredWorkouts)
                          auditView.text = report.auditLogs.joinToString("\n• ", prefix = "• ")

                          aiOutputView.text = "KI analysiert Historie & Tagesdaten..."
                          aiOutputView.text = coachClient.generateInsight(prefs.getString("gemini_api_key", "") ?: "", report)
                      } catch (e: Exception) { statusView.text = "Fehler: ${e.message}" }
                  }
              }

              private fun renderMuscleGroups(sets: Map<MuscleGroup, Int>) {
                  muscleGroupContainer.removeAllViews()
                  for (mg in MuscleGroup.values()) {
                      val count = sets[mg] ?: 0
                      val bars = "█".repeat(count.coerceAtMost(8)) + "░".repeat((4 - count).coerceAtLeast(0))
                      muscleGroupContainer.addView(TextView(this).apply {
                          text = "${mg.label.padEnd(11)} $bars  (${count}×)"; textSize = 13f; typeface = Typeface.MONOSPACE
                          setTextColor(if (count > 0) Color.parseColor("#7EE787") else Color.parseColor("#8B949E")); setPadding(0, 6, 0, 6)
                      })
                  }
              }

              private fun renderWorkouts(workouts: List<UnifiedWorkout>) {
                  workoutsContainer.removeAllViews()
                  if (workouts.isEmpty()) { workoutsContainer.addView(createCardTextView("Keine Trainings im Zeitraum (${selectedRange.label}).")); return }
                  for (w in workouts.reversed()) {
                      val mgLabel = if (w.muscleGroups.isEmpty()) { if (w.isStrength) "Muskelgruppen: Antippen zum Zuweisen" else "Ausdauer-Einheit" } else "Muskeln: ${w.muscleGroups.joinToString(", ") { it.label }}"
                      val card = createCardTextView("[${w.dateLabel}] ${w.title} (${w.durationMinutes} Min.)\nPuls: Ø ${w.avgHeartRate ?: "-"} / Max ${w.maxHeartRate ?: "-"} bpm • ${w.activeKcal} kcal\n$mgLabel\nQuelle: ${w.sourceSummary}").apply {
                          setOnClickListener { openMusclePickerDialog(w) }
                      }
                      workoutsContainer.addView(card, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(0, 0, 0, 14) })
                  }
              }

              private fun openMusclePickerDialog(workout: UnifiedWorkout) {
                  val prefs = getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  val allGroups = MuscleGroup.values()
                  val checked = BooleanArray(allGroups.size) { workout.muscleGroups.contains(allGroups[it]) }
                  AlertDialog.Builder(this)
                      .setTitle("Muskelgruppen: ${workout.title}")
                      .setMultiChoiceItems(allGroups.map { it.label }.toTypedArray(), checked) { _, which, isChecked -> checked[which] = isChecked }
                      .setPositiveButton("Speichern") { _, _ ->
                          prefs.edit().putStringSet("muscles_${workout.id}", allGroups.indices.filter { checked[it] }.map { allGroups[it].name }.toSet()).apply()
                          refreshHealthData()
                      }.setNegativeButton("Abbrechen", null).show()
              }

              private fun sectionLabel(title: String) = TextView(this).apply { text = title; textSize = 11f; setTypeface(null, Typeface.BOLD); setTextColor(Color.parseColor("#8B949E")); setPadding(4, 20, 0, 8) }
              private fun createCardTextView(initialText: String, bgHex: String = "#161B22", strokeHex: String = "#30363D") = TextView(this).apply { text = initialText; textSize = 13.5f; setTextColor(Color.parseColor("#E6EDF3")); setPadding(28, 22, 28, 22); background = cardBackground(bgHex, strokeHex) }
              private fun cardBackground(bgHex: String, strokeHex: String) = GradientDrawable().apply { setColor(Color.parseColor(bgHex)); cornerRadius = 22f; setStroke(2, Color.parseColor(strokeHex)) }
          }
          EOF

      - name: Debug APK kompilieren
        run: gradle assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FoldHealthCoach-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
