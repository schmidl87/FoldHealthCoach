              private fun renderFitnessTab(rep: HealthReport) {
                  // Zeitraum-Filter
                  val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 0, 0, 16) }
                  for (opt in TimeRangeOption.values()) {
                      val sel = opt == selectedRange
                      bar.addView(TextView(this).apply {
                          text = opt.label; gravity = Gravity.CENTER; textSize = 12.5f
                          setTypeface(null, if (sel) Typeface.BOLD else Typeface.NORMAL)
                          setTextColor(if (sel) Color.WHITE else Color.parseColor("#8B949E"))
                          setPadding(12, 16, 12, 16)
                          background = pillBg(if (sel) "#1A2433" else "#12171F", if (sel) "#2997FF" else "#1F2733")
                          layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { setMargins(6, 0, 6, 0) }
                          setOnClickListener { selectedRange = opt; refreshHealthData() }
                      })
                  }
                  contentHost.addView(bar)

                  // Muskelgruppen
                  contentHost.addView(createCard().apply {
                      addView(label("SPEEDIANCE MUSKELGRUPPEN (${rep.selectedRange.label})", "#FF9F0A"))
                      for (mg in MuscleGroup.values()) {
                          val c = rep.periodMuscleSets[mg] ?: 0
                          val bars = "█".repeat(c.coerceAtMost(8)) + "░".repeat((4 - c).coerceAtLeast(0))
                          addView(TextView(this@MainActivity).apply {
                              text = "${mg.label.padEnd(11)} $bars  (${c}×)"
                              textSize = 13f; typeface = Typeface.MONOSPACE
                              setTextColor(if (c > 0) Color.parseColor("#16E06B") else Color.parseColor("#7D8590"))
                              setPadding(0, 4, 0, 4)
                          })
                      }
                  })

                  // Aktivitäten mit Ø Puls, Max Puls & Mini-Pulskurve
                  if (rep.filteredWorkouts.isEmpty()) {
                      contentHost.addView(createCard().apply { addView(bodyText("Keine Trainings im Zeitraum (${rep.selectedRange.label}).")) })
                      return
                  }
                  for (w in rep.filteredWorkouts.reversed()) {
                      val mgText = if (w.muscleGroups.isNotEmpty()) "Muskeln: ${w.muscleGroups.joinToString { it.label }}" else if (w.isStrength) "Antippen für Muskelgruppen & Pulsverlauf" else "Antippen für Pulsverlauf & Zonen"
                      contentHost.addView(createCard().apply {
                          addView(label("${w.dateLabel} • ${w.sourceSummary.uppercase()} • STRAIN ${w.strainScore}", "#2997FF"))
                          addView(bigMetric("${w.title} (${w.durationMinutes} Min.)"))
                          addView(bodyText("♥ Ø ${w.avgHeartRate ?: "-"} bpm   |   Max ${w.maxHeartRate ?: "-"} bpm   |   🔥 ${w.activeKcal} kcal"))
                          if (w.hrCurve.size >= 2) addView(HeartRateChartView(this@MainActivity, w.hrCurve, compact = true))
                          addView(TextView(this@MainActivity).apply {
                              text = mgText; textSize = 12f; setTextColor(Color.parseColor("#8B949E")); setPadding(0, 8, 0, 0)
                          })
                          setOnClickListener { openWorkoutDetailDialog(w) }
                      })
                  }
              }

              private fun openWorkoutDetailDialog(w: UnifiedWorkout) {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(40, 32, 40, 24); setBackgroundColor(Color.parseColor("#12171F"))
                  }
                  box.addView(TextView(this).apply {
                      text = "♥ Ø ${w.avgHeartRate ?: "-"} bpm  •  Max ${w.maxHeartRate ?: "-"} bpm  •  ${w.activeKcal} kcal"
                      textSize = 14f; setTextColor(Color.WHITE); setPadding(0, 0, 0, 16)
                  })
                  box.addView(HeartRateChartView(this, w.hrCurve, compact = false))
                  if (w.zoneMinutes.size == 5) {
                      box.addView(TextView(this).apply {
                          text = "\nPulszonen (Minuten):\nZ1 Leicht: ${w.zoneMinutes[0]}m  |  Z2 Fettverbrennung: ${w.zoneMinutes[1]}m\nZ3 Aerob: ${w.zoneMinutes[2]}m  |  Z4 Schwelle: ${w.zoneMinutes[3]}m  |  Z5 Max: ${w.zoneMinutes[4]}m"
                          textSize = 12.5f; setTextColor(Color.parseColor("#C9D1D9"))
                      })
                  }

                  val prefs = getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  val allGroups = MuscleGroup.values()
                  val checked = BooleanArray(allGroups.size) { w.muscleGroups.contains(allGroups[it]) }

                  AlertDialog.Builder(this)
                      .setTitle("${w.title} (${w.dateLabel})")
                      .setView(box)
                      .setMultiChoiceItems(allGroups.map { "Muskel: ${it.label}" }.toTypedArray(), checked) { _, which, isChecked -> checked[which] = isChecked }
                      .setPositiveButton("Muskel-Tags speichern") { _, _ ->
                          prefs.edit().putStringSet("muscles_${w.id}", allGroups.indices.filter { checked[it] }.map { allGroups[it].name }.toSet()).apply()
                          refreshHealthData()
                      }
                      .setNegativeButton("Schließen", null)
                      .show()
              }

              private fun renderHealthTab(rep: HealthReport) {
