                  contentHost.addView(createCard().apply {
                      addView(label("HRV-VERLAUF (7 TAGE IN MS)", "#16E06B"))
                      addView(MiniBarChartView(this@MainActivity, rep.hrvTrend7d, Color.parseColor("#16E06B")))
                  })

                  contentHost.addView(createCard().apply {
                      addView(label("DATEN-BEREINIGUNG & QUELLEN-CHECK", "#32D7FF"))
                      addView(bodyText(rep.auditLogs.joinToString("\n• ", prefix = "• ")))
                  })

                  val prefs = getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)
                  val ageEdit = EditText(this).apply { hint = "Dein Alter (z. B. 39)"; setText(prefs.getInt("user_age", 39).toString()); inputType = InputType.TYPE_CLASS_NUMBER; setTextColor(Color.WHITE); setHintTextColor(Color.GRAY) }
                  val keyEdit = EditText(this).apply { hint = "Optional: Google Gemini API-Key"; setText(prefs.getString("gemini_api_key", "")); inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD; setTextColor(Color.WHITE); setHintTextColor(Color.GRAY) }

                  contentHost.addView(createCard().apply {
