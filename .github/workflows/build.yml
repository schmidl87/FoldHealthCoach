          EOF
                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/HealthFusionEngine.kt
          package de.fold8.healthcoach

          import android.content.Context
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.permission.HealthPermission
          import androidx.health.connect.client.records.*
          import androidx.health.connect.client.request.ReadRecordsRequest
          import androidx.health.connect.client.time.TimeRangeFilter
          import java.time.Duration
          import java.time.Instant
          import java.time.LocalDate
          import java.time.ZoneId
          import java.time.format.DateTimeFormatter
          import kotlin.math.min
          import kotlin.math.roundToInt

          enum class DataSource(val label: String, val priority: Int) {
              GARMIN("Garmin", 3),
              SPEEDIANCE("Speediance", 2),
              SAMSUNG("Samsung Health", 1),
              OTHER("Andere App", 0)
          }

          data class UnifiedWorkout(
              val title: String,
              val startTime: Instant,
              val endTime: Instant,
              val durationMinutes: Long,
              val avgHeartRate: Int?,
              val maxHeartRate: Int?,
              val activeKcal: Int,
              val sourceSummary: String,
              val wasMerged: Boolean,
              val isNonStepActivity: Boolean
          )

          data class DailyHealthReport(
              val dateLabel: String,
              val cleanSteps: Long,
              val rawSteps: Long,
              val cleanActiveKcal: Int,
              val restingHr: Int?,
              val sleepHours: Double?,
              val workouts: List<UnifiedWorkout>,
              val auditLogs: List<String>,
              val recoveryScore: Int
          )

          class HealthFusionEngine(private val context: Context) {

              companion object {
                  val REQUIRED_PERMISSIONS = setOf(
                      HealthPermission.getReadPermission(StepsRecord::class),
                      HealthPermission.getReadPermission(ExerciseSessionRecord::class),
                      HealthPermission.getReadPermission(HeartRateRecord::class),
                      HealthPermission.getReadPermission(RestingHeartRateRecord::class),
                      HealthPermission.getReadPermission(SleepSessionRecord::class),
                      HealthPermission.getReadPermission(ActiveCaloriesBurnedRecord::class)
                  )
              }

              private fun classifySource(packageName: String): DataSource {
                  val pkg = packageName.lowercase()
                  return when {
                      pkg.contains("garmin") -> DataSource.GARMIN
                      pkg.contains("speediance") -> DataSource.SPEEDIANCE
                      pkg.contains("shealth") || pkg.contains("samsung") -> DataSource.SAMSUNG
                      else -> DataSource.OTHER
                  }
              }

              suspend fun buildReportForLast24Hours(): DailyHealthReport {
                  val client = HealthConnectClient.getOrCreate(context)
                  val now = Instant.now()
                  val startOfWindow = LocalDate.now().atStartOfDay(ZoneId.systemDefault()).toInstant()
                  val sleepLookback = startOfWindow.minus(Duration.ofHours(14))
                  val logs = mutableListOf<String>()

                  val rawWorkouts = client.readRecords(
                      ReadRecordsRequest(ExerciseSessionRecord::class, TimeRangeFilter.between(startOfWindow, now))
                  ).records
                  val rawHr = client.readRecords(
                      ReadRecordsRequest(HeartRateRecord::class, TimeRangeFilter.between(startOfWindow, now))
                  ).records
                  val rawCalories = client.readRecords(
                      ReadRecordsRequest(ActiveCaloriesBurnedRecord::class, TimeRangeFilter.between(startOfWindow, now))
                  ).records
                  val rawSteps = client.readRecords(
                      ReadRecordsRequest(StepsRecord::class, TimeRangeFilter.between(startOfWindow, now))
                  ).records
                  val rawRestingHr = client.readRecords(
                      ReadRecordsRequest(RestingHeartRateRecord::class, TimeRangeFilter.between(sleepLookback, now))
                  ).records
                  val rawSleep = client.readRecords(
                      ReadRecordsRequest(SleepSessionRecord::class, TimeRangeFilter.between(sleepLookback, now))
                  ).records

                  val unifiedWorkouts = mergeWorkouts(rawWorkouts, rawHr, rawCalories, logs)
                  val totalRawSteps = rawSteps.sumOf { it.count }
                  val cleanSteps = filterAndDeduplicateSteps(rawSteps, unifiedWorkouts, logs)
                  val cleanActiveKcal = deduplicateCalories(rawCalories, unifiedWorkouts, logs)

                  val restingHr = rawRestingHr
                      .sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).priority }
                      .firstOrNull()?.beatsPerMinute?.toInt()

                  val sleepHours = deduplicateSleepHours(rawSleep, logs)
                  val recoveryScore = calculateRecoveryScore(restingHr, sleepHours, unifiedWorkouts)

                  if (logs.isEmpty()) {
                      logs.add("Keine Duplikate oder Ausreißer im aktuellen Zeitraum gefunden.")
                  }

                  val dateLabel = LocalDate.now().format(DateTimeFormatter.ofPattern("dd.MM.yyyy"))
                  return DailyHealthReport(
                      dateLabel, cleanSteps, totalRawSteps, cleanActiveKcal,
                      restingHr, sleepHours, unifiedWorkouts, logs, recoveryScore
                  )
              }

              private fun mergeWorkouts(
                  sessions: List<ExerciseSessionRecord>,
                  hrRecords: List<HeartRateRecord>,
                  calRecords: List<ActiveCaloriesBurnedRecord>,
                  logs: MutableList<String>
              ): List<UnifiedWorkout> {
                  val sorted = sessions.sortedBy { it.startTime }
                  val used = BooleanArray(sorted.size)
                  val result = mutableListOf<UnifiedWorkout>()

                  for (i in sorted.indices) {
                      if (used[i]) continue
                      val base = sorted[i]
                      val baseSrc = classifySource(base.metadata.dataOrigin.packageName)
                      var partner: ExerciseSessionRecord? = null
                      var partnerSrc: DataSource? = null

                      for (j in i + 1 until sorted.size) {
                          if (used[j]) continue
                          val candidate = sorted[j]
                          if (overlapRatio(base.startTime, base.endTime, candidate.startTime, candidate.endTime) >= 0.50) {
                              used[j] = true
                              partner = candidate
                              partnerSrc = classifySource(candidate.metadata.dataOrigin.packageName)
                              break
                          }
                      }

                      val start = if (partner != null) minOf(base.startTime, partner.startTime) else base.startTime
                      val end = if (partner != null) maxOf(base.endTime, partner.endTime) else base.endTime
                      val durationMin = Duration.between(start, end).toMinutes().coerceAtLeast(1L)

                      val chosenType = when {
                          baseSrc == DataSource.SPEEDIANCE -> base.exerciseType
                          partnerSrc == DataSource.SPEEDIANCE && partner != null -> partner.exerciseType
                          else -> base.exerciseType
                      }

                      val title = resolveWorkoutTitle(base, partner, chosenType)

                      val windowHrSamples = hrRecords
                          .filter { it.endTime >= start && it.startTime <= end }
                          .sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).priority }
                          .flatMap { it.samples }
                          .filter { it.time in start..end }
                          .map { it.beatsPerMinute.toInt() }

                      val avgHr = if (windowHrSamples.isNotEmpty()) windowHrSamples.average().roundToInt() else null
                      val maxHr = windowHrSamples.maxOrNull()

                      val workoutCalRecords = calRecords.filter {
                          overlapRatio(start, end, it.startTime, it.endTime) >= 0.50
                      }.sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).priority }

                      val kcal = workoutCalRecords
                          .map { it.energy.inKilocalories.roundToInt() }
                          .firstOrNull { it in 10..2500 }
                          ?: (durationMin * 6).toInt()

                      val sourceSummary = if (partner != null && partnerSrc != null) {
                          logs.add("Training verschmolzen: '$title' (${baseSrc.label} + ${partnerSrc.label}) → nicht doppelt gezählt.")
                          "${baseSrc.label} + ${partnerSrc.label} (verschmolzen)"
                      } else {
                          baseSrc.label
                      }

                      val isNonStep = chosenType in setOf(
                          ExerciseSessionRecord.EXERCISE_TYPE_BIKING,
                          ExerciseSessionRecord.EXERCISE_TYPE_BIKING_STATIONARY,
                          ExerciseSessionRecord.EXERCISE_TYPE_STRENGTH_TRAINING,
                          ExerciseSessionRecord.EXERCISE_TYPE_WEIGHTLIFTING,
                          ExerciseSessionRecord.EXERCISE_TYPE_ROWING_MACHINE
                      )

                      result.add(
                          UnifiedWorkout(
                              title, start, end, durationMin, avgHr, maxHr,
                              kcal, sourceSummary, partner != null, isNonStep
                          )
                      )
                  }
                  return result
              }

              private fun filterAndDeduplicateSteps(
                  steps: List<StepsRecord>,
                  workouts: List<UnifiedWorkout>,
                  logs: MutableList<String>
              ): Long {
                  val prioritized = steps.sortedWith(
                      compareByDescending<StepsRecord> { classifySource(it.metadata.dataOrigin.packageName).priority }
                          .thenBy { it.startTime }
                  )
                  val accepted = mutableListOf<StepsRecord>()
                  var skippedDuplicateSteps = 0L
                  var skippedGhostSteps = 0L

                  for (rec in prioritized) {
                      val durMin = Duration.between(rec.startTime, rec.endTime).toMinutes().coerceAtLeast(1L)
                      if (rec.count / durMin > 260L) {
                          skippedGhostSteps += rec.count
                          continue
                      }
                      if (workouts.any { w -> w.isNonStepActivity && overlapRatio(w.startTime, w.endTime, rec.startTime, rec.endTime) >= 0.70 }) {
                          skippedGhostSteps += rec.count
                          continue
                      }
                      if (accepted.any { existing -> overlapRatio(existing.startTime, existing.endTime, rec.startTime, rec.endTime) >= 0.50 }) {
                          skippedDuplicateSteps += rec.count
                          continue
                      }
                      accepted.add(rec)
                  }

                  if (skippedDuplicateSteps > 0L) logs.add("Doppelte Schritte entfernt: $skippedDuplicateSteps Schritte aus Zweit-App ignoriert.")
                  if (skippedGhostSteps > 0L) logs.add("Geister-Schritte bereinigt: $skippedGhostSteps Schritte während Rad/Krafttraining abgezogen.")
                  return accepted.sumOf { it.count }
              }

              private fun deduplicateCalories(
                  calRecords: List<ActiveCaloriesBurnedRecord>,
                  workouts: List<UnifiedWorkout>,
                  logs: MutableList<String>
              ): Int {
                  val prioritized = calRecords.sortedWith(
                      compareByDescending<ActiveCaloriesBurnedRecord> { classifySource(it.metadata.dataOrigin.packageName).priority }
                          .thenBy { it.startTime }
                  )
                  val accepted = mutableListOf<ActiveCaloriesBurnedRecord>()
                  var skippedKcal = 0

                  for (rec in prioritized) {
                      val kcal = rec.energy.inKilocalories.roundToInt()
                      if (kcal <= 0 || kcal > 3000) continue
                      if (accepted.any { existing -> overlapRatio(existing.startTime, existing.endTime, rec.startTime, rec.endTime) >= 0.50 }) {
                          skippedKcal += kcal
                          continue
                      }
                      accepted.add(rec)
                  }

                  if (skippedKcal > 0) logs.add("Doppelte Aktivkalorien verhindert: $skippedKcal kcal aus Parallel-Aufzeichnung verworfen.")
                  val fromRecords = accepted.sumOf { it.energy.inKilocalories.roundToInt() }
                  val fromWorkouts = workouts.sumOf { it.activeKcal }
                  return maxOf(fromRecords, fromWorkouts)
              }

              private fun deduplicateSleepHours(sleepRecords: List<SleepSessionRecord>, logs: MutableList<String>): Double? {
                  if (sleepRecords.isEmpty()) return null
                  val best = sleepRecords.maxByOrNull {
                      classifySource(it.metadata.dataOrigin.packageName).priority * 10000L +
                              Duration.between(it.startTime, it.endTime).toMinutes()
                  } ?: return null

                  if (sleepRecords.size > 1) {
                      logs.add("Schlaf-Duplikat bereinigt: Primärquelle ${classifySource(best.metadata.dataOrigin.packageName).label} übernommen.")
                  }
                  val minutes = Duration.between(best.startTime, best.endTime).toMinutes()
                  return (minutes / 6.0).roundToInt() / 10.0
              }

              private fun calculateRecoveryScore(restingHr: Int?, sleepHours: Double?, workouts: List<UnifiedWorkout>): Int {
                  var score = 75
                  if (sleepHours != null) score += when { sleepHours >= 7.5 -> 12; sleepHours >= 6.5 -> 4; else -> -14 }
                  if (restingHr != null) score += when { restingHr <= 54 -> 10; restingHr <= 64 -> 3; else -> -10 }
                  if (workouts.sumOf { it.durationMinutes } > 90) score -= 8
                  return score.coerceIn(15, 99)
              }

              private fun overlapRatio(s1: Instant, e1: Instant, s2: Instant, e2: Instant): Double {
                  val overlapSec = Duration.between(maxOf(s1, s2), minOf(e1, e2)).seconds
                  if (overlapSec <= 0L) return 0.0
                  val d1 = Duration.between(s1, e1).seconds.coerceAtLeast(1L)
                  val d2 = Duration.between(s2, e2).seconds.coerceAtLeast(1L)
                  return overlapSec.toDouble() / min(d1, d2).toDouble()
              }

              private fun resolveWorkoutTitle(base: ExerciseSessionRecord, partner: ExerciseSessionRecord?, type: Int): String {
                  val customTitle = listOfNotNull(base.title, partner?.title).firstOrNull { it.isNotBlank() }
                  if (customTitle != null) return customTitle
                  return when (type) {
                      ExerciseSessionRecord.EXERCISE_TYPE_STRENGTH_TRAINING,
                      ExerciseSessionRecord.EXERCISE_TYPE_WEIGHTLIFTING -> "Krafttraining (Speediance/Gym)"
                      ExerciseSessionRecord.EXERCISE_TYPE_BIKING,
                      ExerciseSessionRecord.EXERCISE_TYPE_BIKING_STATIONARY -> "Radfahren / Indoor-Cycling"
                      ExerciseSessionRecord.EXERCISE_TYPE_RUNNING,
                      ExerciseSessionRecord.EXERCISE_TYPE_RUNNING_TREADMILL -> "Laufen / Laufband"
                      ExerciseSessionRecord.EXERCISE_TYPE_WALKING -> "Gehen"
                      else -> "Trainingseinheit"
                  }
              }
          }
          EOF
                    cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/GeminiCoachClient.kt
          package de.fold8.healthcoach

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class GeminiCoachClient {

              suspend fun generateInsight(apiKey: String, report: DailyHealthReport): String =
                  withContext(Dispatchers.IO) {
                      if (apiKey.isBlank()) return@withContext buildLocalCoachFallback(report)

                      val workoutSummary = if (report.workouts.isEmpty()) {
                          "Heute bisher keine Trainings."
                      } else {
                          report.workouts.joinToString("; ") { w ->
                              "${w.title}: ${w.durationMinutes} Min, ${w.activeKcal} kcal, Ø Puls ${w.avgHeartRate ?: "-"} bpm (${w.sourceSummary})"
                          }
                      }

                      val prompt = """
                          Du bist ein pragmatischer, sportwissenschaftlich fundierter KI-Gesundheits- und Trainingscoach.
                          Analysiere diese bereits von Duplikaten bereinigten Tagesdaten eines Athleten (Krafttraining + Ausdauer):
                          - Datum: ${report.dateLabel}
                          - Bereinigte Schritte: ${report.cleanSteps} (Rohdaten: ${report.rawSteps})
                          - Bereinigte Aktivkalorien: ${report.cleanActiveKcal} kcal
                          - Ruhepuls: ${report.restingHr ?: "unbekannt"} bpm
                          - Schlafdauer: ${report.sleepHours ?: "unbekannt"} Stunden
                          - Erholungs-Index: ${report.recoveryScore}/100
                          - Trainings: $workoutSummary
                          - Bereinigungen: ${report.auditLogs.joinToString(" | ")}

                          Antworte kurz, konkret und motivierend auf Deutsch in 3 Abschnitten:
                          1. Daten- & Belastungscheck
                          2. Regeneration & Körperstatus
                          3. Konkrete Empfehlung für heute
                      """.trimIndent()

                      try {
                          val endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}"
                          val conn = (URL(endpoint).openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Content-Type", "application/json; charset=UTF-8")
                              doOutput = true
                              connectTimeout = 15000
                              readTimeout = 20000
                          }

                          val payload = JSONObject().put(
                              "contents",
                              JSONArray().put(JSONObject().put("parts", JSONArray().put(JSONObject().put("text", prompt))))
                          )
                          conn.outputStream.use { it.write(payload.toString().toByteArray(Charsets.UTF_8)) }

                          val code = conn.responseCode
                          val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                          val responseText = stream.bufferedReader().use { it.readText() }

                          if (code !in 200..299) {
                              return@withContext "Gemini API Fehler ($code):\n$responseText\n\n---\n" + buildLocalCoachFallback(report)
                          }

                          JSONObject(responseText).getJSONArray("candidates")
                              .getJSONObject(0).getJSONObject("content")
                              .getJSONArray("parts").getJSONObject(0)
                              .getString("text").trim()
                      } catch (e: Exception) {
                          "Netzwerkfehler (${e.message}). Lokale Auswertung:\n\n" + buildLocalCoachFallback(report)
                      }
                  }

              private fun buildLocalCoachFallback(report: DailyHealthReport): String {
                  val sb = StringBuilder()
                  sb.appendLine("1. Daten- & Belastungscheck")
                  sb.appendLine("Bereinigt: ${report.cleanSteps} Schritte, ${report.cleanActiveKcal} Aktivkalorien (${report.workouts.size} gültige Einheit(en)).\n")
                  sb.appendLine("2. Regeneration & Körperstatus")
                  sb.appendLine("Erholungs-Index: ${report.recoveryScore}/100 (Schlaf: ${report.sleepHours ?: "-"} Std., Ruhepuls: ${report.restingHr ?: "-"} bpm).\n")
                  sb.appendLine("3. Konkrete Empfehlung für heute")
                  when {
                      report.recoveryScore >= 80 && report.workouts.isEmpty() ->
                          sb.appendLine("Gute Erholung! Idealer Tag für Krafttraining oder Sweet-Spot-/VO2max-Intervalle.")
                      report.recoveryScore >= 70 && report.workouts.isNotEmpty() ->
                          sb.appendLine("Solides Pensum absolviert. Fokus auf Protein, Flüssigkeit und lockeres Ausrollen.")
                      else ->
                          sb.appendLine("Regeneration priorisieren: Eher lockeres Zone-2-Tempo oder Mobilität statt Maximalbelastung.")
                  }
                  return sb.toString().trim()
              }
          }
