          cat << 'EOF' > app/src/main/java/de/fold8/healthcoach/MainActivity.kt
          package de.fold8.healthcoach

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.text.InputType
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.health.connect.client.HealthConnectClient
          import androidx.health.connect.client.PermissionController
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch

          class MainActivity : AppCompatActivity() {

              private lateinit var fusionEngine: HealthFusionEngine
              private val coachClient = GeminiCoachClient()
              private var lastReport: DailyHealthReport? = null

              private lateinit var statusView: TextView
              private lateinit var metricsView: TextView
              private lateinit var workoutsView: TextView
              private lateinit var auditView: TextView
              private lateinit var aiOutputView: TextView
              private lateinit var apiKeyInput: EditText

              private val requestPermissionsLauncher = registerForActivityResult(
                  PermissionController.createRequestPermissionResultContract()
              ) { granted ->
                  if (granted.containsAll(HealthFusionEngine.REQUIRED_PERMISSIONS)) {
                      statusView.text = "Health Connect: Alle Leserechte aktiv"
                      refreshHealthData()
                  } else {
                      statusView.text = "Health Connect: Berechtigungen fehlen (${granted.size}/${HealthFusionEngine.REQUIRED_PERMISSIONS.size})"
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  fusionEngine = HealthFusionEngine(this)
                  val prefs = getSharedPreferences("fold_health_prefs", Context.MODE_PRIVATE)

                  val rootScroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0D1117")) }
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(44, 72, 44, 72)
                  }

                  val header = TextView(this).apply {
                      text = "Fold Health Coach"
                      textSize = 26f
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.WHITE)
                  }
                  val subHeader = TextView(this).apply {
                      text = "Garmin • Speediance • Health Connect KI-Fusion"
                      textSize = 14f
                      setTextColor(Color.parseColor("#8B949E"))
                      setPadding(0, 4, 0, 28)
                  }
                  statusView = TextView(this).apply {
                      text = "Prüfe Health Connect..."
                      textSize = 14f
                      setTextColor(Color.parseColor("#58A6FF"))
                      setPadding(0, 0, 0, 20)
                  }

                  val btnPermissions = Button(this).apply {
                      text = "1. Health Connect Rechte verbinden"
                      setOnClickListener { checkAndRequestPermissions() }
                  }
                  val btnSync = Button(this).apply {
                      text = "2. Daten laden & Duplikate bereinigen"
                      setOnClickListener { refreshHealthData() }
                  }

                  metricsView = createCardTextView("Noch keine Daten geladen. Tippe auf Schritt 1 & 2.")
                  workoutsView = createCardTextView("Bereinigte Trainings erscheinen hier.")
                  auditView = createCardTextView("Plausibilitäts- & Duplikat-Protokoll erscheint hier.")

                  apiKeyInput = EditText(this).apply {
                      hint = "Optional: Google Gemini API-Key eingeben"
                      setText(prefs.getString("gemini_api_key", ""))
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.parseColor("#6E7681"))
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setPadding(24, 24, 24, 24)
                  }

                  val btnAiAnalyze = Button(this).apply {
                      text = "3. KI-Gesundheitsanalyse starten"
                      setOnClickListener {
                          prefs.edit().putString("gemini_api_key", apiKeyInput.text.toString()).apply()
                          runAiCoaching()
                      }
                  }

                  aiOutputView = createCardTextView("Hier erscheint deine persönliche KI-Auswertung.")

                  container.addView(header)
                  container.addView(subHeader)
                  container.addView(statusView)
                  container.addView(btnPermissions)
                  container.addView(btnSync)
                  container.addView(sectionLabel("BEREINIGTE TAGESWERTE"))
                  container.addView(metricsView)
                  container.addView(sectionLabel("ZUSAMMENGEFÜHRTE TRAININGS"))
                  container.addView(workoutsView)
                  container.addView(sectionLabel("DUPLIKAT- & PLAUSIBILITÄTS-CHECK"))
                  container.addView(auditView)
                  container.addView(sectionLabel("KI-COACH (GEMINI)"))
                  container.addView(apiKeyInput)
                  container.addView(btnAiAnalyze)
                  container.addView(aiOutputView)

                  rootScroll.addView(container)
                  setContentView(rootScroll)
                  checkInitialStatus()
              }

              private fun checkInitialStatus() {
                  if (HealthConnectClient.getSdkStatus(this) != HealthConnectClient.SDK_AVAILABLE) {
                      statusView.text = "Health Connect ist auf diesem Gerät nicht verfügbar."
                      return
                  }
                  lifecycleScope.launch {
                      val granted = HealthConnectClient.getOrCreate(this@MainActivity).permissionController.getGrantedPermissions()
                      if (granted.containsAll(HealthFusionEngine.REQUIRED_PERMISSIONS)) {
                          statusView.text = "Health Connect: Verbunden & bereit"
                          refreshHealthData()
                      } else {
                          statusView.text = "Bitte Schritt 1 antippen, um Health Connect freizugeben."
                      }
                  }
              }

              private fun checkAndRequestPermissions() {
                  if (HealthConnectClient.getSdkStatus(this) != HealthConnectClient.SDK_AVAILABLE) {
                      Toast.makeText(this, "Health Connect nicht installiert", Toast.LENGTH_LONG).show()
                      return
                  }
                  requestPermissionsLauncher.launch(HealthFusionEngine.REQUIRED_PERMISSIONS)
              }

              private fun refreshHealthData() {
                  statusView.text = "Lese & bereinige Daten..."
                  lifecycleScope.launch {
                      try {
                          val report = fusionEngine.buildReportForLast24Hours()
                          lastReport = report
                          statusView.text = "Aktualisiert (${report.dateLabel}) • Erholungs-Index: ${report.recoveryScore}/100"

                          metricsView.text = buildString {
                              appendLine("• Schritte (bereinigt): ${report.cleanSteps} (Roh: ${report.rawSteps})")
                              appendLine("• Aktivkalorien (bereinigt): ${report.cleanActiveKcal} kcal")
                              appendLine("• Ruhepuls: ${report.restingHr?.let { "$it bpm" } ?: "nicht erfasst"}")
                              appendLine("• Schlaf: ${report.sleepHours?.let { "$it Std." } ?: "nicht erfasst"}")
                              append("• Erholungs-Index: ${report.recoveryScore} / 100")
                          }

                          workoutsView.text = if (report.workouts.isEmpty()) {
                              "Heute bisher keine Trainings in Health Connect."
                          } else {
                              report.workouts.joinToString("\n\n") { w ->
                                  "• ${w.title} (${w.durationMinutes} Min.)\n" +
                                          "  Puls: Ø ${w.avgHeartRate ?: "-"} / Max ${w.maxHeartRate ?: "-"} bpm | ${w.activeKcal} kcal\n" +
                                          "  Quelle: ${w.sourceSummary}"
                              }
                          }

                          auditView.text = report.auditLogs.joinToString("\n• ", prefix = "• ")
                          runAiCoaching()
                      } catch (e: Exception) {
                          statusView.text = "Fehler beim Lesen: ${e.message}"
                      }
                  }
              }

              private fun runAiCoaching() {
                  val report = lastReport ?: return
                  aiOutputView.text = "KI analysiert deine bereinigten Gesundheitsdaten..."
                  lifecycleScope.launch {
                      aiOutputView.text = coachClient.generateInsight(apiKeyInput.text.toString(), report)
                  }
              }

              private fun sectionLabel(title: String) = TextView(this).apply {
                  text = title
                  textSize = 12f
                  setTypeface(null, Typeface.BOLD)
                  setTextColor(Color.parseColor("#8B949E"))
                  setPadding(4, 28, 0, 8)
              }

              private fun createCardTextView(initialText: String) = TextView(this).apply {
                  text = initialText
                  textSize = 14f
                  setTextColor(Color.parseColor("#E6EDF3"))
                  setPadding(32, 28, 32, 28)
                  background = GradientDrawable().apply {
                      setColor(Color.parseColor("#161B22"))
                      cornerRadius = 24f
                      setStroke(2, Color.parseColor("#30363D"))
                  }
              }
          }
          EOF

      - name: Debug APK kompilieren
        run: gradle assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FoldHealthCoach-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
