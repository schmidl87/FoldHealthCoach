                  arcPaint.strokeWidth = stroke

                  val radius = (minOf(w, h * 0.78f) / 2f) - stroke
                  val cx = w / 2f
                  val cy = radius + stroke + 6f
                  val rect = RectF(cx - radius, cy - radius, cx + radius, cy + radius)

                  canvas.drawArc(rect, 135f, 270f, false, trackPaint)
                  canvas.drawArc(rect, 135f, 270f * progress.coerceIn(0.03f, 1f), false, arcPaint)

                  valPaint.textSize = (radius * 0.56f).coerceIn(24f, 48f)
                  canvas.drawText(valueText, cx, cy + valPaint.textSize * 0.35f, valPaint)

                  lblPaint.textSize = (radius * 0.25f).coerceIn(14f, 24f)
