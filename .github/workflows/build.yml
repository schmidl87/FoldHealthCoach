                  confirmButton = {
                      TextButton(onClick = { onSaveMuscles(selected) }) { Text("Speichern", color = NeonEmerald, fontWeight = FontWeight.Bold) }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) { Text("Schließen", color = MutedGray) }
                  }
              )
          }

