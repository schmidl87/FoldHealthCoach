              private fun estimateOvernightRestingHr(hrRecords: List<HeartRateRecord>, start: Instant, end: Instant): Int? {
                  val samples = hrRecords.filter { it.endTime >= start && it.startTime <= end }
                      .sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }
                      .flatMap { it.samples }
                      .filter { it.time in start..end && it.beatsPerMinute in 40..120 }
                      .map { it.beatsPerMinute.toInt() }
                      .sorted()
                  if (samples.size < 10) return null
                  return samples[(samples.size * 0.12).toInt()]
              }

              private fun buildDailySeries(days: Int, zone: ZoneId, extractor: (Instant, Instant) -> Float?): List<Pair<String, Float>> {
                  val fmt = DateTimeFormatter.ofPattern("dd.MM")
                  val today = LocalDate.now()
                  return (days - 1 downTo 0).map { offset ->
                      val d = today.minusDays(offset.toLong())
                      val s = d.atStartOfDay(zone).toInstant()
                      val e = d.plusDays(1).atStartOfDay(zone).toInstant()
                      d.format(fmt) to (extractor(s, e) ?: 0f)
                  }
              }

              private fun buildSleepDetail(records: List<SleepSessionRecord>, startOfToday: Instant, zone: ZoneId, logs: MutableList<String>): SleepDetail? {
                  if (records.isEmpty()) return null
                  val lookback = startOfToday.minus(Duration.ofHours(16))
                  val lastNightRecords = records.filter { it.endTime >= lookback }
                  val best = (if (lastNightRecords.isNotEmpty()) lastNightRecords else records)
                      .maxByOrNull { classifySource(it.metadata.dataOrigin.packageName).cardioPriority * 10000L + Duration.between(it.startTime, it.endTime).toMinutes() }
                      ?: return null

                  if (lastNightRecords.size > 1) {
                      logs.add("Schlaf-Priorität: ${classifySource(best.metadata.dataOrigin.packageName).label} übernommen.")
                  }

                  var deep = 0L; var rem = 0L; var light = 0L; var awake = 0L
                  for (st in best.stages) {
                      val mins = Duration.between(st.startTime, st.endTime).toMinutes().coerceAtLeast(0L)
                      when (st.stage) {
                          SleepSessionRecord.STAGE_TYPE_DEEP -> deep += mins
                          SleepSessionRecord.STAGE_TYPE_REM -> rem += mins
                          SleepSessionRecord.STAGE_TYPE_AWAKE, SleepSessionRecord.STAGE_TYPE_OUT_OF_BED -> awake += mins
                          else -> light += mins
                      }
                  }
                  val spanMin = Duration.between(best.startTime, best.endTime).toMinutes().coerceAtLeast(1L)
                  val asleepMin = if (deep + rem + light > 0L) (deep + rem + light) else (spanMin - awake).coerceAtLeast(1L)
                  if (deep + rem + light == 0L) light = asleepMin
                  val eff = ((asleepMin.toDouble() / (asleepMin + awake).coerceAtLeast(1L)) * 100.0).roundToInt().coerceIn(50, 99)
                  val perf = ((asleepMin / 450.0) * 100.0).roundToInt().coerceIn(25, 100)

                  val daily7d = buildDailySeries(7, zone) { dStart, dEnd ->
                      val rec = records.filter { it.endTime in dStart..dEnd }
                          .maxByOrNull { classifySource(it.metadata.dataOrigin.packageName).cardioPriority * 10000L + Duration.between(it.startTime, it.endTime).toMinutes() }
                      rec?.let { Duration.between(it.startTime, it.endTime).toMinutes() / 60f }
                  }

                  return SleepDetail(
                      asleepMin, deep, rem, light, awake, eff, perf,
                      classifySource(best.metadata.dataOrigin.packageName).label, daily7d
                  )
              }

              private fun saveAndMergeLocalArchive(prefs: android.content.SharedPreferences, fresh: List<UnifiedWorkout>): List<UnifiedWorkout> {
                  val map = LinkedHashMap<String, UnifiedWorkout>()
                  val rawJson = prefs.getString("workout_archive_v3", null)
                  if (!rawJson.isNullOrBlank()) {
                      try {
                          val arr = JSONArray(rawJson)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              val id = o.getString("id")
                              val mgSet = mutableSetOf<MuscleGroup>()
                              val mgArr = o.optJSONArray("muscles") ?: JSONArray()
                              for (m in 0 until mgArr.length()) MuscleGroup.values().firstOrNull { it.name == mgArr.getString(m) }?.let { mgSet.add(it) }
                              val curve = mutableListOf<Int>()
                              val cArr = o.optJSONArray("hrCurve") ?: JSONArray()
                              for (c in 0 until cArr.length()) curve.add(cArr.getInt(c))
                              val zones = mutableListOf<Int>()
                              val zArr = o.optJSONArray("zones") ?: JSONArray()
                              for (z in 0 until zArr.length()) zones.add(zArr.getInt(z))
                              map[id] = UnifiedWorkout(
                                  id, o.getString("dateLabel"), o.getString("title"),
                                  Instant.ofEpochSecond(o.getLong("startSec")), Instant.ofEpochSecond(o.getLong("endSec")),
                                  o.getLong("durMin"),
                                  if (o.has("avgHr") && !o.isNull("avgHr")) o.getInt("avgHr") else null,
                                  if (o.has("maxHr") && !o.isNull("maxHr")) o.getInt("maxHr") else null,
                                  curve, zones, o.getInt("kcal"), o.optDouble("strain", 6.0),
                                  o.getString("source"), o.getBoolean("isStrength"), o.getBoolean("isNonStep"), mgSet
                              )
                          }
                      } catch (_: Exception) { }
                  }
                  for (w in fresh) map[w.id] = w
                  val sortedAll = map.values.sortedBy { it.startTime }
                  val outArr = JSONArray()
                  for (w in sortedAll) {
                      outArr.put(JSONObject().put("id", w.id).put("dateLabel", w.dateLabel).put("title", w.title)
                          .put("startSec", w.startTime.epochSecond).put("endSec", w.endTime.epochSecond)
                          .put("durMin", w.durationMinutes).put("avgHr", w.avgHeartRate).put("maxHr", w.maxHeartRate)
                          .put("hrCurve", JSONArray(w.hrCurve)).put("zones", JSONArray(w.zoneMinutes))
                          .put("kcal", w.activeKcal).put("strain", w.strainScore).put("source", w.sourceSummary)
                          .put("isStrength", w.isStrength).put("isNonStep", w.isNonStepActivity)
                          .put("muscles", JSONArray(w.muscleGroups.map { it.name })))
                  }
                  prefs.edit().putString("workout_archive_v3", outArr.toString()).apply()
                  return sortedAll
              }

              private fun mergeWorkouts(sessions: List<ExerciseSessionRecord>, hrRecords: List<HeartRateRecord>, calRecords: List<ActiveCaloriesBurnedRecord>, prefs: android.content.SharedPreferences, logs: MutableList<String>, filterStart: Instant, userAge: Int): List<UnifiedWorkout> {
                  val sorted = sessions.sortedBy { it.startTime }
                  val used = BooleanArray(sorted.size)
                  val result = mutableListOf<UnifiedWorkout>()
                  val dateFmt = DateTimeFormatter.ofPattern("dd.MM.").withZone(ZoneId.systemDefault())
                  val estMaxHr = (211 - 0.64 * userAge).roundToInt().coerceIn(160, 205)

                  for (i in sorted.indices) {
                      if (used[i]) continue
                      val base = sorted[i]
                      val baseSrc = classifySource(base.metadata.dataOrigin.packageName, "${base.title ?: ""} ${base.notes ?: ""}")
                      var partner: ExerciseSessionRecord? = null; var partnerSrc: DataSource? = null

                      for (j in i + 1 until sorted.size) {
                          if (used[j]) continue
                          val cand = sorted[j]
                          if (overlapRatio(base.startTime, base.endTime, cand.startTime, cand.endTime) >= 0.50) {
                              used[j] = true; partner = cand
                              partnerSrc = classifySource(cand.metadata.dataOrigin.packageName, "${cand.title ?: ""} ${cand.notes ?: ""}")
                              break
                          }
                      }

                      val isStrength = isStrengthSession(base, baseSrc) || (partner != null && partnerSrc != null && isStrengthSession(partner, partnerSrc))
                      val primary: ExerciseSessionRecord; val secondary: ExerciseSessionRecord?; val primarySrc: DataSource; val secondarySrc: DataSource?
                      if (partner != null && partnerSrc != null) {
                          val swap = if (isStrength) (partnerSrc == DataSource.SPEEDIANCE && baseSrc != DataSource.SPEEDIANCE) else (partnerSrc.cardioPriority > baseSrc.cardioPriority)
                          if (swap) { primary = partner; primarySrc = partnerSrc; secondary = base; secondarySrc = baseSrc }
                          else { primary = base; primarySrc = baseSrc; secondary = partner; secondarySrc = partnerSrc }
                      } else { primary = base; primarySrc = baseSrc; secondary = null; secondarySrc = null }

                      val start = if (secondary != null) minOf(primary.startTime, secondary.startTime) else primary.startTime
                      val end = if (secondary != null) maxOf(primary.endTime, secondary.endTime) else primary.endTime
                      val durationMin = Duration.between(start, end).toMinutes().coerceAtLeast(1L)
                      val workoutId = "w_${start.epochSecond}_${durationMin}"

                      val title = resolveWorkoutTitle(primary, secondary, primarySrc, secondarySrc, isStrength)
                      val muscles = MuscleAndFitnessAnalyzer.detectMuscleGroups(primary, secondary, prefs.getStringSet("muscles_$workoutId", emptySet()) ?: emptySet())

                      val matchingHrRecs = hrRecords.filter { it.endTime >= start.minusSeconds(60) && it.startTime <= end.plusSeconds(60) }
                      val bestSourcePkg = matchingHrRecs.maxByOrNull { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }?.metadata?.dataOrigin?.packageName
                      val rawSamples = matchingHrRecs
                          .filter { bestSourcePkg == null || it.metadata.dataOrigin.packageName == bestSourcePkg }
                          .flatMap { it.samples }
                          .filter { it.time in start.minusSeconds(30)..end.plusSeconds(30) && it.beatsPerMinute in 45..225 }
                          .sortedBy { it.time }

                      val avgHr = if (rawSamples.isNotEmpty()) rawSamples.map { it.beatsPerMinute.toInt() }.average().roundToInt() else null
                      val maxHr = rawSamples.maxOfOrNull { it.beatsPerMinute.toInt() }
                      val hrCurve = downsampleCurve(rawSamples.map { it.beatsPerMinute.toInt() }, 36)
                      val zoneMinutes = computeHrZones(rawSamples.map { it.beatsPerMinute.toInt() }, durationMin.toInt(), estMaxHr)

                      val kcal = calRecords.filter { overlapRatio(start, end, it.startTime, it.endTime) >= 0.50 }
                          .sortedByDescending { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }
                          .map { it.energy.inKilocalories.roundToInt() }.firstOrNull { it in 10..2500 } ?: (durationMin * 6).toInt()

                      val hrRatio = ((avgHr ?: 115).toDouble() / estMaxHr).coerceIn(0.45, 1.0)
                      val strain = (ln(1.0 + durationMin * hrRatio * 0.45) * 3.8).coerceIn(1.5, 20.5)

                      val sourceSummary = if (secondary != null && secondarySrc != null) {
                          if (end >= filterStart) logs.add("Fusioniert: '$title' (${primarySrc.label} + ${secondarySrc.label})")
                          "${primarySrc.label} + ${secondarySrc.label}"
                      } else primarySrc.label

                      val isNonStep = isStrength || primarySrc == DataSource.ZWIFT || primary.exerciseType in setOf(
                          ExerciseSessionRecord.EXERCISE_TYPE_BIKING, ExerciseSessionRecord.EXERCISE_TYPE_BIKING_STATIONARY, ExerciseSessionRecord.EXERCISE_TYPE_ROWING_MACHINE
                      )
                      result.add(UnifiedWorkout(workoutId, dateFmt.format(start), title, start, end, durationMin, avgHr, maxHr, hrCurve, zoneMinutes, kcal, (strain * 10).roundToInt() / 10.0, sourceSummary, isStrength, isNonStep, muscles))
                  }
                  return result
              }

              private fun downsampleCurve(values: List<Int>, targetPoints: Int): List<Int> {
                  if (values.isEmpty()) return emptyList()
                  if (values.size <= targetPoints) return values
                  val step = values.size.toDouble() / targetPoints
                  return (0 until targetPoints).map { idx -> values[(idx * step).toInt().coerceIn(0, values.lastIndex)] }
              }

              private fun computeHrZones(values: List<Int>, totalMin: Int, maxHr: Int): List<Int> {
                  if (values.isEmpty()) return listOf(0, 0, 0, 0, 0)
                  val counts = IntArray(5)
                  for (bpm in values) {
                      val pct = bpm.toDouble() / maxHr
                      when {
                          pct < 0.60 -> counts[0]++
                          pct < 0.70 -> counts[1]++
                          pct < 0.80 -> counts[2]++
                          pct < 0.90 -> counts[3]++
                          else -> counts[4]++
                      }
                  }
                  return counts.map { ((it.toDouble() / values.size) * totalMin).roundToInt() }
              }

              private fun isStrengthSession(rec: ExerciseSessionRecord, src: DataSource): Boolean =
                  src == DataSource.SPEEDIANCE || rec.exerciseType in setOf(ExerciseSessionRecord.EXERCISE_TYPE_STRENGTH_TRAINING, ExerciseSessionRecord.EXERCISE_TYPE_WEIGHTLIFTING, ExerciseSessionRecord.EXERCISE_TYPE_CALISTHENICS)

              private fun filterAndDeduplicateSteps(steps: List<StepsRecord>, workouts: List<UnifiedWorkout>, logs: MutableList<String>, recordLogs: Boolean): Long {
                  val prioritized = steps.sortedWith(compareByDescending<StepsRecord> { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }.thenBy { it.startTime })
                  val accepted = mutableListOf<StepsRecord>()
                  var skippedDup = 0L; var skippedGhost = 0L
                  for (rec in prioritized) {
                      val durMin = Duration.between(rec.startTime, rec.endTime).toMinutes().coerceAtLeast(1L)
                      if (rec.count / durMin > 260L || workouts.any { w -> w.isNonStepActivity && overlapRatio(w.startTime, w.endTime, rec.startTime, rec.endTime) >= 0.70 }) { skippedGhost += rec.count; continue }
                      if (accepted.any { ex -> overlapRatio(ex.startTime, ex.endTime, rec.startTime, rec.endTime) >= 0.50 }) { skippedDup += rec.count; continue }
                      accepted.add(rec)
                  }
                  if (recordLogs && skippedDup > 0L) logs.add("Garmin bevorzugt: $skippedDup doppelte Schritte ignoriert.")
                  if (recordLogs && skippedGhost > 0L) logs.add("Geister-Schritte bereinigt: $skippedGhost Schritte während Zwift/Kraft entfernt.")
                  return accepted.sumOf { it.count }
              }

              private fun deduplicateCalories(calRecords: List<ActiveCaloriesBurnedRecord>, workouts: List<UnifiedWorkout>, logs: MutableList<String>): Int {
                  val prioritized = calRecords.sortedWith(compareByDescending<ActiveCaloriesBurnedRecord> { classifySource(it.metadata.dataOrigin.packageName).cardioPriority }.thenBy { it.startTime })
                  val accepted = mutableListOf<ActiveCaloriesBurnedRecord>()
                  var skipped = 0
                  for (rec in prioritized) {
                      val kcal = rec.energy.inKilocalories.roundToInt()
                      if (kcal <= 0 || kcal > 3000) continue
                      if (accepted.any { ex -> overlapRatio(ex.startTime, ex.endTime, rec.startTime, rec.endTime) >= 0.50 }) { skipped += kcal; continue }
                      accepted.add(rec)
                  }
                  if (skipped > 0) logs.add("Doppelte Kalorien verhindert: $skipped kcal verworfen.")
                  return maxOf(accepted.sumOf { it.energy.inKilocalories.roundToInt() }, workouts.sumOf { it.activeKcal })
              }

              private fun calculateWhoopRecovery(rhr: Int?, hrv: Double?, sleepPerf: Int?, todayWorkouts: List<UnifiedWorkout>): Int {
                  var rec = 62.0
                  if (hrv != null) rec += ((hrv - 42.0) * 0.45).coerceIn(-20.0, 20.0)
                  if (rhr != null) rec += ((62 - rhr) * 0.9).coerceIn(-18.0, 15.0)
                  if (sleepPerf != null) rec += ((sleepPerf - 80) * 0.35).coerceIn(-15.0, 10.0)
                  if (todayWorkouts.sumOf { it.durationMinutes } > 90) rec -= 6.0
                  return rec.roundToInt().coerceIn(12, 98)
              }

              private fun calculateDayStrain(todayWorkouts: List<UnifiedWorkout>, steps: Long, isToday: Boolean): Double {
                  val wStrain = todayWorkouts.sumOf { it.strainScore }
                  val stepStrain = if (isToday) (steps / 4000.0).coerceAtMost(4.5) else 2.0
                  return ((wStrain * 0.85 + stepStrain).coerceIn(0.5, 20.8) * 10.0).roundToInt() / 10.0
              }

              private fun overlapRatio(s1: Instant, e1: Instant, s2: Instant, e2: Instant): Double {
                  val overlapSec = Duration.between(maxOf(s1, s2), minOf(e1, e2)).seconds
                  if (overlapSec <= 0L) return 0.0
                  return overlapSec.toDouble() / min(Duration.between(s1, e1).seconds.coerceAtLeast(1L), Duration.between(s2, e2).seconds.coerceAtLeast(1L)).toDouble()
              }

              private fun resolveWorkoutTitle(primary: ExerciseSessionRecord, secondary: ExerciseSessionRecord?, primarySrc: DataSource, secondarySrc: DataSource?, isStrength: Boolean): String {
                  val zwiftTitle = when {
                      secondarySrc == DataSource.ZWIFT && !secondary?.title.isNullOrBlank() -> secondary?.title
                      primarySrc == DataSource.ZWIFT && !primary.title.isNullOrBlank() -> primary.title
                      else -> null
                  }
                  if (zwiftTitle != null) return zwiftTitle
                  val custom = listOfNotNull(primary.title, secondary?.title).firstOrNull { it.isNotBlank() }
                  if (custom != null) return custom
                  if (isStrength) return "Krafttraining (Speediance)"
                  if (primarySrc == DataSource.ZWIFT || secondarySrc == DataSource.ZWIFT) return "Zwift Indoor-Cycling"
                  return when (primary.exerciseType) {
                      ExerciseSessionRecord.EXERCISE_TYPE_BIKING, ExerciseSessionRecord.EXERCISE_TYPE_BIKING_STATIONARY -> "Radfahren / Indoor-Cycling"
                      ExerciseSessionRecord.EXERCISE_TYPE_RUNNING, ExerciseSessionRecord.EXERCISE_TYPE_RUNNING_TREADMILL -> "Laufen / Laufband"
                      ExerciseSessionRecord.EXERCISE_TYPE_WALKING -> "Gehen"
                      else -> "Ausdauer-Training"
                  }
              }
          }
