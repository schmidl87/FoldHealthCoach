name: Build Fold Health Coach APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compose-Projekt & Icon erzeugen
        run: |
          mkdir -p app/src/main/java/de/fold8/healthcoach
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          if [ ! -f keystore.b64 ]; then
            keytool -genkeypair -v -keystore app/release.keystore -alias foldcoach -keyalg RSA -keysize 2048 -validity 10000 -storepass foldcoach123 -keypass foldcoach123 -dname "CN=FoldHealthCoach,O=Fold8,C=DE"
            base64 -w 0 app/release.keystore > keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore.b64
            git commit -m "Update-Keystore speichern [skip ci]"
            git push
          else
            base64 -d keystore.b64 > app/release.keystore
          fi

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FoldHealthCoach"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "de.fold8.healthcoach"
              compileSdk = 36

              defaultConfig {
                  applicationId = "de.fold8.healthcoach"
                  minSdk = 28
                  targetSdk = 35
                  versionCode = 6
                  versionName = "4.0"
              }

              buildFeatures {
                  compose = true
              }

              signingConfigs {
                  create("persistent") {
                      storeFile = file("release.keystore")
                      storePassword = "foldcoach123"
                      keyAlias = "foldcoach"
                      keyPassword = "foldcoach123"
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("persistent")
                  }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("persistent")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("androidx.health.connect:connect-client:1.1.0")
          }
          EOF

