          package de.fold8.healthcoach

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class GeminiCoachClient {

              suspend fun generateInsight(apiKey: String, report: HealthReport): String =
                  withContext(Dispatchers.IO) {
                      if (apiKey.isBlank()) return@withContext buildLocalCoachFallback(report)
                      val fp = report.fitnessProfile
                      val muscleText = report.periodMuscleSets.entries.joinToString(", ") { "${it.key.label}: ${it.value}×" }
                      val recentWorkouts = report.filteredWorkouts.takeLast(6).joinToString("; ") { w ->
                          "${w.dateLabel} ${w.title}: ${w.durationMinutes} Min, Ø Puls ${w.avgHeartRate ?: "-"} bpm, Strain ${w.strainScore}"
                      }.ifBlank { "Keine Trainings." }

                      val prompt = "Du bist ein sportwissenschaftlicher KI-Coach (Whoop/Apple Health Stil). " +
                          "Alter: ${fp.chronologicalAge} J., Fitnessalter: ${fp.fitnessAge} J. (${fp.fitnessLevelLabel}), " +
                          "Erholung: ${report.recoveryPercent}%, Tages-Strain: ${report.dayStrain}/21, " +
                          "Ruhepuls: ${report.latestRestingHr ?: "-"} bpm, HRV: ${report.latestHrvMs?.toInt() ?: "-"} ms, " +
                          "Schlaf: ${report.sleepDetail?.let { "${it.totalMinutes / 60}h ${it.totalMinutes % 60}m (Tief ${it.deepMinutes}m, REM ${it.remMinutes}m)" } ?: "-"}, " +
                          "Trainings: $recentWorkouts, Muskelgruppen: $muscleText. " +
                          "Antworte auf Deutsch in 3 kurzen, klaren Punkten: 1. Erholung & Herz-Kreislauf, 2. Training & Muskel-Balance, 3. Empfehlung für heute."

                      try {
                          val endpoint = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey.trim()}"
                          val conn = (URL(endpoint).openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Content-Type", "application/json; charset=UTF-8")
                              doOutput = true; connectTimeout = 15000; readTimeout = 20000
                          }
                          val payload = JSONObject().put("contents", JSONArray().put(JSONObject().put("parts", JSONArray().put(JSONObject().put("text", prompt)))))
                          conn.outputStream.use { it.write(payload.toString().toByteArray(Charsets.UTF_8)) }
                          if (conn.responseCode !in 200..299) return@withContext buildLocalCoachFallback(report)
                          val resp = conn.inputStream.bufferedReader().use { it.readText() }
                          JSONObject(resp).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").trim()
                      } catch (_: Exception) { buildLocalCoachFallback(report) }
                  }

              private fun buildLocalCoachFallback(report: HealthReport): String {
                  val fp = report.fitnessProfile
                  val openMuscles = report.periodMuscleSets.filterValues { it == 0 }.keys.joinToString(", ") { it.label }
                  return buildString {
                      appendLine("• Erholung ${report.recoveryPercent}% • Strain ${report.dayStrain}/21 • Fitnessalter ${fp.fitnessAge} J.")
                      appendLine(if (openMuscles.isBlank()) "• Muskel-Balance: Alle 6 Gruppen abgedeckt." else "• Muskel-Fokus offen: $openMuscles.")
                      append(when {
                          report.recoveryPercent >= 70 -> "• Empfehlung: Hohe Bereitschaft – ideal für Speediance-Kraft oder Intervalle."
                          report.recoveryPercent >= 45 -> "• Empfehlung: Moderate Belastung (Zone-2-Cardio oder Technik-Kraft)."
                          else -> "• Empfehlung: Niedrige Erholung – Fokus auf Schlaf, Elektrolyte und Regeneration."
                      })
                  }
              }
          }
